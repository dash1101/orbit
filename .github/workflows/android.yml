name: android

# Builds Orbit for Android on every push. A tag like v0.2.0 also publishes the APK (with SHA256SUMS) as a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Signing key (when the repository has one)
        env:
          ORBIT_KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$ORBIT_KEYSTORE_B64" ]; then
            echo "$ORBIT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbit-release.jks"
            echo "ORBIT_KEYSTORE=$RUNNER_TEMP/orbit-release.jks" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "::error::Releases must be signed with the persistent key. Add the ORBIT_KEYSTORE_B64, ORBIT_KEYSTORE_PASSWORD and ORBIT_KEY_ALIAS secrets (see the README), then run the tag again."
            exit 1
          else
            echo "::warning::No ORBIT_KEYSTORE_B64 secret: this APK is signed with a throwaway key, so it can't update an installed copy."
          fi
      - name: Build APK
        working-directory: android
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
        run: |
          name="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) name="0.0.0-dev" ;; esac
          gradle --no-daemon :app:assembleRelease -PorbitVersionName="$name" -PorbitVersionCode="${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/orbit-android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: orbit-android, path: orbit-android.apk }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: orbit-android, path: out }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv out/orbit-android.apk "out/orbit-android-${GITHUB_REF_NAME}.apk"
          # the desktop app: plain Python, so one archive serves Linux, Windows and macOS
          git archive --format=tar.gz --prefix="orbit-${GITHUB_REF_NAME}/" -o "out/orbit-desktop-${GITHUB_REF_NAME}.tar.gz" HEAD -- orbit install.sh README.md
          cd out
          sha256sum * > SHA256SUMS
          cat > notes.md <<'NOTES'
          One place for Pocketfader, Nova and YTM Beacon.

          - **Desktop** (Linux, Windows, macOS): unpack `orbit-desktop-*.tar.gz`, then `./install.sh` on Linux or `python -m orbit` (`py -m orbit` on Windows). Needs Python 3.9 or newer.
          - **Android** (5.0+): install `orbit-android-*.apk`, then install Pocketfader and Nova from it.

          Check downloads against `SHA256SUMS`. Pre-release: the Android app has not been tried on a device yet.
          NOTES
          gh release create "$GITHUB_REF_NAME" orbit-android-*.apk orbit-desktop-*.tar.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --prerelease --title "Orbit $GITHUB_REF_NAME" --notes-file notes.md
