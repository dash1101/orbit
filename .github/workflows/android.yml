name: android

# Builds Orbit for Android on every push. A tag like v0.2.0 also publishes the APK (with SHA256SUMS) as a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Signing key (when the repository has one)
        env:
          ORBIT_KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$ORBIT_KEYSTORE_B64" ]; then
            echo "$ORBIT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbit-release.jks"
            echo "ORBIT_KEYSTORE=$RUNNER_TEMP/orbit-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ORBIT_KEYSTORE_B64 secret: the APK is signed with a throwaway key, so it can't update an installed copy."
          fi
      - name: Build APK
        working-directory: android
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
        run: |
          name="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) name="0.0.0-dev" ;; esac
          gradle --no-daemon :app:assembleRelease -PorbitVersionName="$name" -PorbitVersionCode="${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/orbit-android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: orbit-android, path: orbit-android.apk }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: orbit-android, path: out }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          mv orbit-android.apk "orbit-android-${GITHUB_REF_NAME}.apk"
          sha256sum *.apk > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --prerelease --title "Orbit $GITHUB_REF_NAME" \
            --notes "Orbit for Android: install the APK, then install Pocketfader and Nova from it."
