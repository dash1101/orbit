name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Catalog, icons, translations, themes and release notes are consistent
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - name: The apps' icons match their own repositories
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python tools/sync-icons.py --check && python tools/make-catalog.py --check
      - name: Page script parses
        run: |
          python - <<'PY'
          import re, pathlib
          s = pathlib.Path("web/index.html").read_text()
          pathlib.Path("page.mjs").write_text(re.search(r"<script>(.*)</script>", s, re.S).group(1))
          PY
          node --check page.mjs
