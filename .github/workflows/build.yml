name: build

# Builds Orbit for every system on each push. A tag like v0.2.0 publishes a pre-release with all of it:
#   Linux, Windows and macOS (Apple chips and Intel) programs that need nothing installed, and the Android app.
# The Android app is only added when it was signed with the release key (see RELEASING.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Signing key (when the repository has one)
        id: key
        env:
          ORBIT_KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$ORBIT_KEYSTORE_B64" ]; then
            echo "$ORBIT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbit-release.jks"
            echo "ORBIT_KEYSTORE=$RUNNER_TEMP/orbit-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing key stored here: tag builds are left unsigned, other builds use a throwaway key."
          fi
      - name: Build APK
        working-directory: android
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          name="${GITHUB_REF_NAME#v}"; extra=""
          case "$GITHUB_REF" in
            refs/tags/*) [ "$SIGNED" = true ] || extra="-PorbitUnsigned=true" ;;
            *) name="0.0.0-dev" ;;
          esac
          gradle --no-daemon :app:assembleRelease -PorbitVersionName="$name" -PorbitVersionCode="${GITHUB_RUN_NUMBER}" $extra
          if [ -n "$extra" ]; then out=orbit-android-unsigned.apk; else out=orbit-android.apk; fi
          cp app/build/outputs/apk/release/app-release*.apk "$GITHUB_WORKSPACE/$out"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "orbit-android*.apk" }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x86_64 }          # older glibc: runs on more distributions
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-apple-silicon }
          - { os: macos-15-intel, name: macos-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # the tests are written for Linux; on the other systems the program itself is smoke-tested below
      - name: Tests
        shell: bash
        run: python -W error::ResourceWarning -m unittest discover -s tests -t .
        continue-on-error: ${{ runner.os != 'Linux' }}
      - name: "Build (bundles Python, so nothing needs installing to run it)"
        shell: bash
        run: |
          pip install pyinstaller
          sep=":"; [ "$RUNNER_OS" = Windows ] && sep=";"
          common=(--noconfirm --paths . --collect-submodules orbit --add-data "orbit/static${sep}orbit/static")
          if [ "$RUNNER_OS" = Windows ]; then
            pyinstaller "${common[@]}" --onefile --windowed --name orbit packaging/entry.py
          elif [ "$RUNNER_OS" = macOS ]; then
            pyinstaller "${common[@]}" --windowed --name Orbit --osx-bundle-identifier app.novalabs.orbit packaging/entry.py
          else
            pyinstaller "${common[@]}" --onefile --name orbit packaging/entry.py
          fi
          ls -la dist
      - name: "Smoke test (start it, ask it for its pages)"
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) exe=dist/orbit.exe ;;
            macOS) exe=dist/Orbit.app/Contents/MacOS/Orbit ;;
            *) exe=dist/orbit ;;
          esac
          "$exe" --no-window --dry-run --port 8799 > run.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            sleep 1
            if curl -sf http://127.0.0.1:8799/api/hub -o hub.json; then ok=1; break; fi
          done
          cat run.log || true
          [ "$ok" = 1 ] || { echo "the program did not start"; exit 1; }
          grep -q '"name": "Orbit"' hub.json
          curl -sf http://127.0.0.1:8799/ -o page.html && grep -q "<title>Orbit</title>" page.html
          curl -sf http://127.0.0.1:8799/apps/nova.svg -o /dev/null
          curl -sf http://127.0.0.1:8799/api/install -o install.json && grep -q '"host"' install.json
          kill $pid || true
          echo "smoke test passed"
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Windows) (cd dist && 7z a -tzip ../out/orbit-windows-x64.zip orbit.exe) ;;
            macOS) ditto -c -k --keepParent dist/Orbit.app "out/orbit-${{ matrix.name }}.zip" ;;
            *) tar -C dist -czf out/orbit-linux-x86_64.tar.gz orbit ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: "desktop-${{ matrix.name }}", path: out/* }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          ls -la
          rm -f orbit-android-unsigned.apk         # never published: it can't be installed
          for f in orbit-*; do mv "$f" "$(echo "$f" | sed "s/^orbit-/orbit-${GITHUB_REF_NAME}-/")"; done
          sha256sum orbit-* > SHA256SUMS
          # the release may already exist (the Android app is added later): then add or replace the files
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -O old-sums 2>/dev/null || true
            cat SHA256SUMS old-sums 2>/dev/null | awk '!seen[$2]++' > merged && mv merged SHA256SUMS   # new lines win
            gh release upload "$GITHUB_REF_NAME" orbit-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file ../packaging/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" orbit-* SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "Orbit $GITHUB_REF_NAME" --notes-file ../packaging/release-notes.md
          fi
