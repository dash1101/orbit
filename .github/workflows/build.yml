name: build

# Builds Orbit for every system on each push. A tag like v0.2.0 publishes a pre-release with all of it:
#   Linux, Windows and macOS (Apple chips and Intel) programs that need nothing installed, and the Android app.
# The Android app is only added when it was signed with the release key (see RELEASING.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Signing key (when the repository has one)
        id: key
        env:
          ORBIT_KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$ORBIT_KEYSTORE_B64" ]; then
            echo "$ORBIT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbit-release.jks"
            echo "ORBIT_KEYSTORE=$RUNNER_TEMP/orbit-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing key stored here: tag builds are left unsigned, other builds use a throwaway key."
          fi
      - name: Build APK
        working-directory: android
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          name="${GITHUB_REF_NAME#v}"; extra=""
          case "$GITHUB_REF" in
            refs/tags/*) [ "$SIGNED" = true ] || extra="-PorbitUnsigned=true" ;;
            *) name="0.0.0-dev" ;;
          esac
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease -PorbitVersionName="$name" -PorbitVersionCode="${GITHUB_RUN_NUMBER}" $extra
          if [ -n "$extra" ]; then out=orbit-android-unsigned.apk; else out=orbit-android.apk; fi
          cp app/build/outputs/apk/release/app-release*.apk "$GITHUB_WORKSPACE/$out"
          echo "unit tests:"; grep -ho '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "orbit-android*.apk" }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x86_64 }          # older glibc: runs on more distributions
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-apple-silicon }
          - { os: macos-15-intel, name: macos-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # the same tests on every system (a few that use shell scripts as stand-ins for programs skip Windows)
      - name: Tests
        shell: bash
        run: python -W error::ResourceWarning -m unittest discover -s tests -t .
      - name: "Build (bundles Python, so nothing needs installing to run it)"
        shell: bash
        run: |
          pip install pyinstaller pillow   # Pillow turns the PNG icon into .ico / .icns
          sep=":"; [ "$RUNNER_OS" = Windows ] && sep=";"
          common=(--noconfirm --paths . --collect-submodules orbit --add-data "orbit/static${sep}orbit/static")
          if [ "$RUNNER_OS" = Windows ]; then
            pyinstaller "${common[@]}" --onefile --windowed --name orbit --icon packaging/icon/orbit-1024.png packaging/entry.py
          elif [ "$RUNNER_OS" = macOS ]; then
            pyinstaller "${common[@]}" --windowed --name Orbit --osx-bundle-identifier app.novalabs.orbit --icon packaging/icon/orbit-mac-1024.png packaging/entry.py
          else
            pyinstaller "${common[@]}" --onefile --name orbit packaging/entry.py
          fi
          ls -la dist
      - name: "Smoke test (start it, ask it for its pages)"
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) exe=dist/orbit.exe ;;
            macOS) exe=dist/Orbit.app/Contents/MacOS/Orbit ;;
            *) exe=dist/orbit ;;
          esac
          "$exe" --no-window --dry-run --port 8799 > run.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            sleep 1
            if curl -sf http://127.0.0.1:8799/api/hub -o hub.json; then ok=1; break; fi
          done
          cat run.log || true
          [ "$ok" = 1 ] || { echo "the program did not start"; exit 1; }
          grep -q '"name": "Orbit"' hub.json
          curl -sf http://127.0.0.1:8799/ -o page.html && grep -q "<title>Orbit</title>" page.html
          curl -sf http://127.0.0.1:8799/apps/nova.svg -o /dev/null
          curl -sf http://127.0.0.1:8799/api/install -o install.json && grep -q '"host"' install.json
          # Pages must answer quickly although none of the apps run here (Windows takes ~2 s per refused connection).
          for round in cold warm; do
            for path in /api/apps /api/apps/pocketfader /api/apps/ytm-beacon /api/apps/nova /api/apps/pocketfader/logs /api/hub /api/install; do
              t=$(curl -s -o /dev/null -w "%{time_total}" "http://127.0.0.1:8799$path")
              echo "$round $path ${t}s"
              awk -v t="$t" 'BEGIN { exit !(t < 3.0) }' || { echo "too slow: $path took ${t}s"; exit 1; }
            done
          done
          kill $pid || true
          echo "smoke test passed"
      # Orbit updates itself on Linux and Windows: a second build that says 99.0.0 is published by a stand-in GitHub, and
      # this build must update itself to it through its own API, restart on it, and delete the old program.
      - name: "Self-update (a real update to a newer build, then a restart)"
        shell: bash
        run: |
          cp orbit/__init__.py "$RUNNER_TEMP/init.py"
          sed -i.bak 's/^__version__ = .*/__version__ = "99.0.0"/' orbit/__init__.py
          sep=":"; [ "$RUNNER_OS" = Windows ] && sep=";"
          common=(--noconfirm --paths . --collect-submodules orbit --add-data "orbit/static${sep}orbit/static"
                  --distpath dist-next --workpath build-next)
          if [ "$RUNNER_OS" = Windows ]; then
            pyinstaller "${common[@]}" --onefile --windowed --name orbit packaging/entry.py
            cp "$RUNNER_TEMP/init.py" orbit/__init__.py
            python tools/ci-selfupdate.py dist/orbit.exe dist-next/orbit.exe windows-x64.exe
          elif [ "$RUNNER_OS" = macOS ]; then
            pyinstaller "${common[@]}" --windowed --name Orbit --osx-bundle-identifier app.novalabs.orbit packaging/entry.py
            cp "$RUNNER_TEMP/init.py" orbit/__init__.py
            mkdir -p dmg-next && cp -R dist-next/Orbit.app dmg-next/ && ln -s /Applications dmg-next/Applications
            hdiutil create -volname Orbit -srcfolder dmg-next -ov -format UDZO next.dmg
            python tools/ci-selfupdate.py dist/Orbit.app next.dmg "${{ matrix.name }}.dmg"
          else
            pyinstaller "${common[@]}" --onefile --name orbit packaging/entry.py
            cp "$RUNNER_TEMP/init.py" orbit/__init__.py
            python tools/ci-selfupdate.py dist/orbit dist-next/orbit linux-x86_64
          fi
      # One file per download, nothing to unpack: the .exe and the Linux program as they are; on macOS the app is a
      # folder (Orbit.app), so it goes in a disk image with an Applications shortcut to drag it onto.
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Windows) cp dist/orbit.exe out/orbit-windows-x64.exe ;;
            macOS)
              mkdir -p dmg && cp -R dist/Orbit.app dmg/ && ln -s /Applications dmg/Applications
              hdiutil create -volname Orbit -srcfolder dmg -ov -format UDZO "out/orbit-${{ matrix.name }}.dmg"
              # open it like a person would and check the app inside is there and runnable
              hdiutil attach "out/orbit-${{ matrix.name }}.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/orbit-dmg"
              test -x "$RUNNER_TEMP/orbit-dmg/Orbit.app/Contents/MacOS/Orbit"
              test -L "$RUNNER_TEMP/orbit-dmg/Applications"
              "$RUNNER_TEMP/orbit-dmg/Orbit.app/Contents/MacOS/Orbit" --version
              hdiutil detach "$RUNNER_TEMP/orbit-dmg"
              ;;
            *) cp dist/orbit out/orbit-linux-x86_64 ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: "desktop-${{ matrix.name }}", path: out/* }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          ls -la
          rm -f orbit-android-unsigned.apk         # never published: it can't be installed
          # The files keep one name from release to release (orbit-windows-x64.exe …), so a program that updates
          # itself keeps its name too. Orbit 0.3.4 and older look for names with the version in them to update
          # themselves (orbit-v0.3.4-windows-x64.exe): through the 0.3 series they get a copy under that name as well.
          case "$GITHUB_REF_NAME" in
            v0.3.*) for f in orbit-*; do cp "$f" "$(echo "$f" | sed "s/^orbit-/orbit-${GITHUB_REF_NAME}-/")"; done ;;
          esac
          sha256sum orbit-* > SHA256SUMS
          # the release may already exist (the Android app is added later): then add or replace the files
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -O old-sums 2>/dev/null || true
            cat SHA256SUMS old-sums 2>/dev/null | awk '!seen[$2]++' > merged && mv merged SHA256SUMS   # new lines win
            gh release upload "$GITHUB_REF_NAME" orbit-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file ../packaging/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" orbit-* SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "Orbit $GITHUB_REF_NAME" --notes-file ../packaging/release-notes.md
          fi
