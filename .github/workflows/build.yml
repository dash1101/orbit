name: build

# Builds Orbit for every system on each push. A tag like v0.2.0 publishes a pre-release with all of it:
#   the Linux, Windows and macOS (Apple chips and Intel) programs (desktop/, Rust with its own window on the system's
#   web engine) and the Android app. Each desktop build is tested on its own system first: unit tests, a look at the
#   window, a real update to a newer build and a restart, and on Windows installing, checking and removing Nova and
#   YTM Starcast through the program, and moving a computer from Pocketfader and YTM Beacon to YTM Starcast.
# The Android app is only added when it was signed with the release key (see RELEASING.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      everything:
        description: "Build every system (ARM and Macs too), as at a milestone"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # What to build. Every push and release: Windows and Linux on x86-64 (and Android). Milestones (tags vX.Y.0), a tag
  # whose message says "all systems", or a manual run with "everything": Windows and Linux on ARM and both Macs too.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env: { EVERYTHING: "${{ inputs.everything }}" }
        run: |
          # Linux builds on Ubuntu 22.04: its older glibc runs on more distributions
          x86='{"os":"ubuntu-22.04","name":"linux-x86_64","deb":"amd64"},{"os":"windows-latest","name":"windows-x64"}'
          rest='{"os":"ubuntu-22.04-arm","name":"linux-arm64","deb":"arm64"},{"os":"windows-11-arm","name":"windows-arm64"},{"os":"macos-latest","name":"macos-apple-silicon"},{"os":"macos-15-intel","name":"macos-intel"}'
          all=false
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.0$ ]] && all=true
          [ "$EVERYTHING" = true ] && all=true
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git fetch -q --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            msg=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
            grep -qi "all systems" <<<"$msg" && all=true
          fi
          if [ "$all" = true ]; then list="$x86,$rest"; echo "every system"; else list="$x86"; echo "Windows and Linux on x86-64"; fi
          echo "matrix={\"include\":[$list]}" >> "$GITHUB_OUTPUT"

  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Signing key (when the repository has one)
        id: key
        env:
          ORBIT_KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_B64 }}
        run: |
          if [ -n "$ORBIT_KEYSTORE_B64" ]; then
            echo "$ORBIT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbit-release.jks"
            echo "ORBIT_KEYSTORE=$RUNNER_TEMP/orbit-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing key stored here: tag builds are left unsigned, other builds use a throwaway key."
          fi
      - name: Build APK
        working-directory: android
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          name="${GITHUB_REF_NAME#v}"; extra=""
          case "$GITHUB_REF" in
            refs/tags/*) [ "$SIGNED" = true ] || extra="-PorbitUnsigned=true" ;;
            *) name="0.0.0-dev" ;;
          esac
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease -PorbitVersionName="$name" -PorbitVersionCode="${GITHUB_RUN_NUMBER}" $extra
          if [ -n "$extra" ]; then out=orbit-android-unsigned.apk; else out=orbit-android.apk; fi
          cp app/build/outputs/apk/release/app-release*.apk "$GITHUB_WORKSPACE/$out"
          echo "unit tests:"; grep -ho '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "orbit-android*.apk" }

  android-run:
    # The Android app on a real Android (an emulator: no window, no sound): it installs, opens, draws its first screen
    # and doesn't crash. Builds other than release tags sign the APK with a throwaway key, so it can be installed.
    needs: android
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true   # new: an emulator can be slow to start on these machines, so it doesn't hold up releases yet
    steps:
      - uses: actions/download-artifact@v4
        with: { name: android }
      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Start Android 14
        timeout-minutes: 20
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"; adb="$ANDROID_HOME/platform-tools/adb"
          img="system-images;android-34;google_apis;x86_64"
          # avdmanager and the emulator look for devices in different places by default: one place for both
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          say() { echo "$(date +%T) $*"; }
          say "kvm: $(ls -l /dev/kvm)"
          say "installing the system image"
          timeout 600 "$sdk/sdkmanager" --install "$img" emulator platform-tools < /dev/null > sdk.log 2>&1 || { tail -30 sdk.log; exit 1; }
          tail -2 sdk.log
          say "creating the device"
          echo no | timeout 120 "$sdk/avdmanager" create avd -n orbit -k "$img" -d pixel_6 --force
          say "starting the emulator"
          nohup "$ANDROID_HOME/emulator/emulator" -avd orbit -no-window -no-audio -no-boot-anim -no-snapshot -accel on \
            -gpu swiftshader_indirect -camera-back none -camera-front none > emulator.log 2>&1 &
          emu=$!
          for i in $(seq 300); do
            kill -0 $emu 2>/dev/null || { say "the emulator ended:"; tail -60 emulator.log; exit 1; }
            [ "$(timeout 10 "$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            [ $((i % 20)) = 0 ] && say "still starting… $(tail -1 emulator.log)"
            sleep 3
          done
          [ "$(timeout 10 "$adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ] || { say "didn't start:"; tail -60 emulator.log; exit 1; }
          for k in window_animation_scale transition_animation_scale animator_duration_scale; do "$adb" shell settings put global $k 0; done
          say "booted: Android $("$adb" shell getprop ro.build.version.release | tr -d '\r')"
      - name: Install Orbit, open it, look at it
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"; mkdir -p shots
          "$adb" install -r orbit-android.apk
          # Orbit's "install apps" permission, given before it starts (it looks when it opens and comes back to the front)
          "$adb" shell appops set app.novalabs.orbit REQUEST_INSTALL_PACKAGES allow
          "$adb" logcat -c
          "$adb" shell am start -W -n app.novalabs.orbit/.MainActivity
          sleep 20
          "$adb" exec-out screencap -p > shots/android-1-start.png
          texts() { "$adb" shell uiautomator dump /sdcard/ui.xml > /dev/null && "$adb" exec-out cat /sdcard/ui.xml \
                      | grep -o 'text="[^"]*"' | sed 's/text="//; s/"$//' | grep -v '^$' | tr '\n' '|'; echo; }
          echo "on screen: $(texts)"
          # install Nova: Orbit's wizard downloads it from GitHub, checks its signature, then hands it to Android, which
          # asks (the test stops at Android's question).
          tap() {  # tap the node with this text: "first" after the text $2 (or anywhere), or the "last" one on screen
            "$adb" shell uiautomator dump /sdcard/ui.xml > /dev/null; "$adb" exec-out cat /sdcard/ui.xml > ui.xml
            xy=$(WANT="$1" AFTER="$2" WHICH="$3" python3 -c '
          import os, re
          want, after, which = os.environ["WANT"], os.environ["AFTER"], os.environ["WHICH"]
          seen, found = not after, []
          for n in re.findall(r"<node [^>]*>", open("ui.xml").read()):
              t, b = re.search(r" text=\"([^\"]*)\"", n), re.search(r"bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"", n)
              if not (t and b):
                  continue
              if t.group(1) == after:
                  seen = True
              elif seen and t.group(1) == want:
                  x1, y1, x2, y2 = map(int, b.groups()); found.append(((x1 + x2) // 2, (y1 + y2) // 2))
          if found:
              x, y = found[0] if which == "first" else found[-1]; print(x, y)
          ')
            [ -n "$xy" ] && "$adb" shell input tap $xy
          }
          tap install Nova first; sleep 8
          "$adb" exec-out screencap -p > shots/android-2-install-nova.png
          seen="$(texts)"; echo "Nova's install: $seen"
          case "$seen" in
            *"GitHub's limit"*|*"GitHub refused"*) echo "::warning::GitHub's limit for requests without a sign-in is used up on this shared machine: the download isn't tried" ;;
            *)
              tap install "" last
              for i in $(seq 40); do
                focus=$("$adb" shell dumpsys window | grep -m1 mCurrentFocus | tr -d '\r')
                case "$focus" in *packageinstaller*|*PackageInstaller*) break ;; esac
                sleep 3
              done
              "$adb" exec-out screencap -p > shots/android-3-android-asks.png
              echo "then: $(texts)"
              case "$focus" in *packageinstaller*|*PackageInstaller*) echo "Android asks to install Nova: Orbit downloaded it and its signature checked out" ;;
                *) echo "::warning::Android's install question didn't come up ($focus)" ;; esac ;;
          esac
          "$adb" shell input keyevent KEYCODE_BACK; sleep 2; "$adb" shell input keyevent KEYCODE_BACK; sleep 2
          # Nova installed from its newest release, as the owner has it: when that release is newer for other systems only
          # (Nova's server-only releases carry the same app file), Orbit says it's up to date instead of offering it again
          tag=$(gh release view -R dash1101/Nova --json tagName -q .tagName)
          gh release download "$tag" -R dash1101/Nova -p nova-universal.apk -D novaapk --clobber
          "$adb" install -r novaapk/nova-universal.apk > /dev/null
          have=$("$adb" shell dumpsys package app.novalabs.nova | grep -m1 versionName | sed 's/.*versionName=//' | tr -d '\r ')
          "$adb" shell am force-stop app.novalabs.orbit; "$adb" shell am start -W -n app.novalabs.orbit/.MainActivity > /dev/null; sleep 15
          "$adb" exec-out screencap -p > shots/android-4-nova-installed.png
          seen="$(texts)"; echo "with Nova $have installed (its newest release: $tag): $seen"
          if [ "${tag#v}" != "$have" ]; then
            case "$seen" in
              *"its Android app is the one you have"*) echo "Nova $have is up to date: release $tag is new for other systems only" ;;
              *"GitHub"*) echo "::warning::GitHub didn't answer here: the up-to-date check isn't tried" ;;
              *) echo "::error::Orbit doesn't see that release $tag's Android app is the Nova $have installed"; exit 1 ;;
            esac
          fi
          "$adb" logcat -d > logcat.txt
          pid=$("$adb" shell pidof app.novalabs.orbit | tr -d '\r')
          if grep -q "FATAL EXCEPTION" logcat.txt || [ -z "$pid" ]; then
            grep -A40 "FATAL EXCEPTION" logcat.txt | head -80; echo "::error::Orbit crashed or isn't running"; exit 1
          fi
          echo "Orbit runs on Android (pid $pid), no crash"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots-android, path: "shots/", if-no-files-found: ignore }

  desktop:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "desktop -> target" }
      - uses: actions/setup-python@v5        # Orbit's real-machine checks are Python scripts
        with: { python-version: "3.12" }
      - name: Linux libraries for the window
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          # Ubuntu's mirrors sometimes stall on GitHub's machines: retry, and give up on a stalled download quickly
          apt="-o Acquire::Retries=5 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for try in 1 2 3; do
            sudo apt-get $apt update && sudo apt-get $apt install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb imagemagick x11-utils && break
            echo "attempt $try failed; trying again"; sleep 20
          done
          pkg-config --exists webkit2gtk-4.1
      - name: Unit tests
        working-directory: desktop
        run: cargo test
      - name: Build
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # the window is a second build, carried inside the program and started only when WebKitGTK is there
            cargo build --release --features window
            cp target/release/orbit "$RUNNER_TEMP/orbit-window"
            ORBIT_WINDOW_BIN="$RUNNER_TEMP/orbit-window" cargo build --release
          else
            cargo build --release --features window
          fi
          ls -la target/release
          ./target/release/orbit --version || true
      - name: Smoke test (the server answers, quickly)
        run: |
          exe=desktop/target/release/orbit; [ "$RUNNER_OS" = Windows ] && exe=desktop/target/release/orbit.exe
          start=$(python -c "import time; print(time.time())")
          "$exe" --no-window --port 8799 > run.log 2>&1 &
          pid=$!
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:8799/api/hub -o hub.json && break; sleep 0.1; done
          python -c "import time; print(f'answered after {time.time() - $start:.2f} s (first start)')"
          cat run.log
          grep -q '"name":"Orbit"' hub.json
          curl -sf http://127.0.0.1:8799/ -o page.html && grep -q "<title>Orbit</title>" page.html
          curl -sf http://127.0.0.1:8799/apps/nova.svg -o /dev/null
          curl -sf http://127.0.0.1:8799/api/install -o install.json && grep -q '"host"' install.json
          for round in cold warm; do
            for path in /api/apps /api/apps/nova /api/apps/nova/logs /api/hub /api/install; do
              t=$(curl -s -o /dev/null -w "%{time_total}" "http://127.0.0.1:8799$path")
              echo "$round $path ${t}s"
              awk -v t="$t" 'BEGIN { exit !(t < 3.0) }' || { echo "too slow: $path took ${t}s"; exit 1; }
            done
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: evil.example" http://127.0.0.1:8799/api/hub); [ "$code" = 403 ]
          code=$(curl -s -o /dev/null -w "%{http_code}" -d "a=b" http://127.0.0.1:8799/api/hub); [ "$code" = 400 ]
          kill $pid || true
          sleep 1
          start=$(python -c "import time; print(time.time())")
          "$exe" --no-window --port 8797 > run2.log 2>&1 &
          pid=$!
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:8797/api/hub -o /dev/null && break; sleep 0.05; done
          python -c "import time; print(f'answered after {time.time() - $start:.2f} s (second start)')"
          kill $pid || true
          echo "smoke test passed"
      - name: Wrap the Mac app
        if: runner.os == 'macOS'
        run: tools/make-mac-app.sh desktop/target/release/orbit "$(desktop/target/release/orbit --version | cut -d' ' -f2)" dist
      - name: Look at the window (screenshot)
        continue-on-error: true
        run: |
          mkdir -p shots
          case "$RUNNER_OS" in
            Linux)
              xvfb-run -a -s "-screen 0 1400x900x24" bash -c '
                desktop/target/release/orbit --port 8798 > win.log 2>&1 &
                sleep 12; import -window root shots/window-${{ matrix.name }}.png; kill %1' || true
              cat win.log || true ;;
            Windows)
              desktop/target/release/orbit.exe --port 8798 > win.log 2>&1 &
              sleep 15
              powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; \$b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds; \$i=New-Object System.Drawing.Bitmap \$b.Width,\$b.Height; \$g=[System.Drawing.Graphics]::FromImage(\$i); \$g.CopyFromScreen(\$b.Location,[System.Drawing.Point]::Empty,\$b.Size); \$i.Save('shots/window-${{ matrix.name }}.png')"
              taskkill //F //IM orbit.exe || true ;;
            macOS)
              open dist/Orbit.app --args --port 8798
              sleep 15; screencapture -x shots/window-${{ matrix.name }}.png || true
              pkill -f "Orbit.app/Contents/MacOS/Orbit" || true ;;
          esac
          curl -sf http://127.0.0.1:8798/api/hub > /dev/null && echo "window's server answered" || true
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "shots-${{ matrix.name }}", path: shots/, if-no-files-found: ignore }
      - name: "The window is named app.novalabs.orbit (so Linux desktops show it with Orbit's icon)"
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" bash -c '
            desktop/target/release/orbit --port 8799 > id.log 2>&1 &
            for i in $(seq 40); do xwininfo -root -tree | grep "\"Orbit\"" > win.txt && break; sleep 1; done
            kill %1' || true
          cat win.txt || true
          grep -q '("app.novalabs.orbit"' win.txt || { echo "::error::the window isn't named app.novalabs.orbit"; cat id.log; exit 1; }
      - name: "Self-update (a real update to a newer build, then a restart)"
        working-directory: desktop
        run: |
          ORBIT_VERSION=99.0.0 CARGO_TARGET_DIR=target-next cargo build --release
          cd ..
          case "$RUNNER_OS" in
            Windows) python tools/ci-selfupdate.py desktop/target/release/orbit.exe desktop/target-next/release/orbit.exe "${{ matrix.name }}.exe" ;;
            macOS)
              tools/make-mac-app.sh desktop/target-next/release/orbit 99.0.0 dist-next
              mkdir -p dmg-next && cp -R dist-next/Orbit.app dmg-next/ && ln -s /Applications dmg-next/Applications
              hdiutil create -volname Orbit -srcfolder dmg-next -ov -format UDZO next.dmg
              python tools/ci-selfupdate.py dist/Orbit.app next.dmg "${{ matrix.name }}.dmg" ;;
            *) python tools/ci-selfupdate.py desktop/target/release/orbit desktop/target-next/release/orbit "${{ matrix.name }}" ;;
          esac
      - name: "Linux: the Debian package installs, and updates itself through apt"
        if: matrix.deb
        run: |
          version=$(desktop/target/release/orbit --version | cut -d' ' -f2)
          tools/make-deb.sh "$RUNNER_TEMP/orbit-window" "$version" "${{ matrix.deb }}" "$RUNNER_TEMP/orbit.deb"
          tools/make-deb.sh desktop/target-next/release/orbit 99.0.0 "${{ matrix.deb }}" "$RUNNER_TEMP/orbit-next.deb"
          dpkg-deb --info "$RUNNER_TEMP/orbit.deb"; dpkg-deb --contents "$RUNNER_TEMP/orbit.deb"
          python tools/ci-selfupdate.py --deb "$RUNNER_TEMP/orbit.deb" "$RUNNER_TEMP/orbit-next.deb" "${{ matrix.name }}"
      - name: "Windows: install, check and remove Nova and YTM Starcast through the program"
        if: matrix.name == 'windows-x64'
        env: { PYTHONIOENCODING: utf-8, GH_TOKEN: "${{ github.token }}" }
        run: python tools/ci-nova-windows.py --exe desktop/target/release/orbit.exe nova,ytm-starcast
      - name: "Windows: move a computer from Pocketfader and YTM Beacon to YTM Starcast through the program"
        if: matrix.name == 'windows-x64'
        env: { PYTHONIOENCODING: utf-8, GH_TOKEN: "${{ github.token }}" }
        run: python tools/ci-nova-windows.py --exe desktop/target/release/orbit.exe ytm-starcast --migrate
      - name: Package
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Windows) cp desktop/target/release/orbit.exe "out/orbit-${{ matrix.name }}.exe" ;;
            macOS)
              mkdir -p dmg && cp -R dist/Orbit.app dmg/ && ln -s /Applications dmg/Applications
              hdiutil create -volname Orbit -srcfolder dmg -ov -format UDZO "out/orbit-${{ matrix.name }}.dmg" ;;
            *)
              cp desktop/target/release/orbit "out/orbit-${{ matrix.name }}"
              tools/make-deb.sh "$RUNNER_TEMP/orbit-window" "$(desktop/target/release/orbit --version | cut -d' ' -f2)" "${{ matrix.deb }}" "out/orbit-${{ matrix.name }}.deb" ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: "desktop-${{ matrix.name }}", path: out/* }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          ls -la
          rm -f orbit-android-unsigned.apk         # never published: it can't be installed
          # The files keep one name from release to release (orbit-windows-x64.exe …), so a program that updates
          # itself keeps its name too. (Up to 0.5.1 each file was also published under a name with the version, for
          # Orbit 0.3.4 and older; those update to 0.5.1 first.)
          sha256sum orbit-* > SHA256SUMS
          # the notes list only the downloads this release has (Macs and ARM get builds at milestones)
          python3 ../tools/release-notes.py ../packaging/release-notes.md . orbit-android.apk > ../notes.md
          # the release may already exist (the Android app is added later): then add or replace the files
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -O old-sums 2>/dev/null || true
            cat SHA256SUMS old-sums 2>/dev/null | awk '!seen[$2]++' > merged && mv merged SHA256SUMS   # new lines win
            gh release upload "$GITHUB_REF_NAME" orbit-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.md
          else
            gh release create "$GITHUB_REF_NAME" orbit-* SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "Orbit $GITHUB_REF_NAME" --notes-file ../notes.md
          fi
