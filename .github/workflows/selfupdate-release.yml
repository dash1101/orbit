name: self-update-from-a-release
# Run by hand after a release: the standalone Orbit from an earlier release (by default the one before the newest)
# updates itself from GitHub to the newest release and restarts on it, on Linux, Windows and macOS
# (tools/ci-selfupdate.py). On a Mac, Orbit updates itself from 0.3.4 on. Macs and ARM computers only get a build at
# milestones (and when a release says so): for them, "newest" and "the one before" are among the releases with their
# file, a system with only one such release has nothing to check yet, and neither has one the newest release has no
# build for.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Release to update from (empty: the one before the newest)"
        default: ""
jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, file: windows-x64.exe }
          - { os: ubuntu-22.04, file: linux-x86_64 }
          - { os: macos-latest, file: macos-apple-silicon.dmg }
          - { os: macos-15-intel, file: macos-intel.dmg }
          - { os: windows-11-arm, file: windows-arm64.exe }
          - { os: ubuntu-22.04-arm, file: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Update an earlier release to the newest one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
          FROM: ${{ inputs.from }}
        run: |
          # the releases with a file for this system, newest first (named with the version before 0.3.5)
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq '.[] | select(.draft | not) | .tag_name as $t
            | select(any(.assets[].name; . == "orbit-${{ matrix.file }}" or . == "orbit-\($t)-${{ matrix.file }}"))
            | $t' | sort -r -V)
          newest=$(echo "$tags" | sed -n 1p)
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq '.[] | select(.draft | not) | .tag_name' | sort -r -V | sed -n 1p)
          if [ -z "$FROM" ] && [ "$newest" != "$latest" ]; then
            echo "$latest has no orbit-${{ matrix.file }} (Macs and ARM get builds at milestones): nothing new to check here"; exit 0
          fi
          from="${FROM:-$(echo "$tags" | sed -n 2p)}"
          if [ -z "$from" ] || [ "$from" = "$newest" ]; then
            echo "only one release has orbit-${{ matrix.file }} ($newest): nothing to update from yet"; exit 0
          fi
          echo "from $from to $newest"
          # releases from 0.3.5 on name the files without the version; before, with it
          name="orbit-${{ matrix.file }}"
          gh release download "$from" -R "$GITHUB_REPOSITORY" -p "$name" -D old 2>/dev/null || {
            name="orbit-$from-${{ matrix.file }}"
            gh release download "$from" -R "$GITHUB_REPOSITORY" -p "$name" -D old
          }
          chmod +x old/* || true
          old="old/$name"
          if [ "$RUNNER_OS" = macOS ]; then         # the app, out of its disk image, as dragged to Applications
            hdiutil attach "$old" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/old-dmg"
            ditto "$RUNNER_TEMP/old-dmg/Orbit.app" old/Orbit.app
            hdiutil detach "$RUNNER_TEMP/old-dmg"
            old=old/Orbit.app
          fi
          python tools/ci-selfupdate.py --real "$old" "${newest#v}"
