name: self-update-from-a-release
# Run by hand after a release: the standalone Orbit from an earlier release (by default the one before the newest)
# updates itself from GitHub to the newest release and restarts on it, on Linux, Windows and macOS
# (tools/ci-selfupdate.py). On a Mac, Orbit updates itself from 0.3.4 on.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Release to update from (empty: the one before the newest)"
        default: ""
jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, file: windows-x64.exe }
          - { os: ubuntu-22.04, file: linux-x86_64 }
          - { os: macos-latest, file: macos-apple-silicon.dmg }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Update an earlier release to the newest one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
          FROM: ${{ inputs.from }}
        run: |
          tags=$(gh release list -R "$GITHUB_REPOSITORY" -L 2 --json tagName -q '.[].tagName')
          newest=$(echo "$tags" | sed -n 1p)
          from="${FROM:-$(echo "$tags" | sed -n 2p)}"
          echo "from $from to $newest"
          gh release download "$from" -R "$GITHUB_REPOSITORY" -p "orbit-$from-${{ matrix.file }}" -D old
          chmod +x old/* || true
          old="old/orbit-$from-${{ matrix.file }}"
          if [ "$RUNNER_OS" = macOS ]; then         # the app, out of its disk image, as dragged to Applications
            hdiutil attach "$old" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/old-dmg"
            ditto "$RUNNER_TEMP/old-dmg/Orbit.app" old/Orbit.app
            hdiutil detach "$RUNNER_TEMP/old-dmg"
            old=old/Orbit.app
          fi
          python tools/ci-selfupdate.py --real "$old" "${newest#v}"
