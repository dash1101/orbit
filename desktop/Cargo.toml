[package]
name = "orbit"
version = "0.5.5"
edition = "2021"
description = "Orbit by NovaLabs: one place for your apps"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "orbit"
path = "src/main.rs"

[features]
default = []
# The window (Tauri, on the system's web engine). Windows and macOS builds have it in the program itself; on Linux
# the window is a second build that the program carries inside it and starts only when WebKitGTK is there.
window = ["dep:tauri", "dep:tauri-build"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
regex = "1"
getrandom = "0.2"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
portable-pty = "0.8"
tauri = { version = "2", optional = true, features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
