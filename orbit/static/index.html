<!doctype html>
<html lang="en" data-theme="tui">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit</title>
<link rel="icon" href="/icon.svg">
<style>
/* ---------------------------------------------------------------- themes
   A theme is a set of tokens. Every theme here is a "tui" look: square boxes whose title sits in the
   border, monospace text, a tiny square for status. New themes only need a new [data-theme] block. */
:root, [data-theme="tui"] {
  --bg: #1c1c1e; --panel: #1c1c1e; --raise: #262629; --line: #3d3d42; --line-hi: #5b5b62;
  --text: #d6d6d8; --muted: #8c8c93; --legend: #9a9aa1; --accent: #f0668e; --accent-ink: #1c1c1e;
  --ok: #23a55a; --warn: #f0b232; --down: #f23f43; --off: #6d6f78; --sel: #e8e8ea;
  --radius: 0px; --glow: none;
  --font: "JetBrains Mono", "Fira Code", "Cascadia Code", "Hack", "DejaVu Sans Mono", ui-monospace, monospace;
}
[data-theme="phosphor"] {
  --bg: #070c08; --panel: #070c08; --raise: #0d1710; --line: #1d3a23; --line-hi: #2f6a3b;
  --text: #a8ffb0; --muted: #4f9a5a; --legend: #62b96e; --accent: #39ff7a; --accent-ink: #04140a;
  --ok: #39ff7a; --warn: #e6ff5c; --down: #ff5c5c; --off: #2f5a36; --sel: #a8ffb0;
  --glow: 0 0 6px rgba(57,255,122,.35);
}
[data-theme="amber"] {
  --bg: #120d05; --panel: #120d05; --raise: #1d1508; --line: #3e2e12; --line-hi: #6b4e1c;
  --text: #ffcf7a; --muted: #a07a3c; --legend: #c4913f; --accent: #ffb000; --accent-ink: #120d05;
  --ok: #ffd36b; --warn: #ff8a3d; --down: #ff4d3d; --off: #5e4722; --sel: #ffcf7a;
  --glow: 0 0 6px rgba(255,176,0,.3);
}
[data-theme="paper"] {
  --bg: #f3f0e8; --panel: #f3f0e8; --raise: #e9e5da; --line: #c4bdae; --line-hi: #8f877a;
  --text: #2a2826; --muted: #6b655e; --legend: #6a645c; --accent: #c2366b; --accent-ink: #fff;
  --ok: #16733d; --warn: #8f5b12; --down: #c53030; --off: #a39d92; --sel: #2a2826;   /* text colours ≥ 4.5:1 on bg and raise */
}
[data-theme="frost"] {
  --bg: #1b2028; --panel: #1b2028; --raise: #232a35; --line: #36404f; --line-hi: #4f5d72;
  --text: #dbe3ee; --muted: #8592a6; --legend: #93a4bb; --accent: #7cc4e8; --accent-ink: #12171e;
  --ok: #8fcf8a; --warn: #ebcb7d; --down: #e0707a; --off: #5d6879; --sel: #e6edf5;
}
[data-theme="ember"] {
  --bg: #1a1412; --panel: #1a1412; --raise: #251c18; --line: #3f302a; --line-hi: #644a3f;
  --text: #ecd9cf; --muted: #9a8276; --legend: #b08d7e; --accent: #ff7a45; --accent-ink: #1a1412;
  --ok: #9ccc65; --warn: #ffc24b; --down: #ff4f4f; --off: #6b574e; --sel: #f3e3da;
}
[data-theme="ocean"] {
  --bg: #0d1b24; --panel: #0d1b24; --raise: #13252f; --line: #20394a; --line-hi: #315670;
  --text: #cfe6f0; --muted: #6f93a5; --legend: #7fa8bb; --accent: #2ec4b6; --accent-ink: #062027;
  --ok: #3ddc97; --warn: #ffbf46; --down: #ff6b6b; --off: #3b5566; --sel: #d8eef7;
}
[data-theme="lilac"] {
  --bg: #1d1a24; --panel: #1d1a24; --raise: #26222f; --line: #3b3448; --line-hi: #594e6d;
  --text: #e4ddf0; --muted: #9389a6; --legend: #a596c2; --accent: #b794f6; --accent-ink: #1d1a24;
  --ok: #7bd88f; --warn: #f2c66d; --down: #f7768e; --off: #625a73; --sel: #efe9f9;
}
[data-theme="mono"] {
  --bg: #111111; --panel: #111111; --raise: #1c1c1c; --line: #333333; --line-hi: #555555;
  --text: #e0e0e0; --muted: #8a8a8a; --legend: #9e9e9e; --accent: #ffffff; --accent-ink: #111111;
  --ok: #cfcfcf; --warn: #a8a8a8; --down: #ffffff; --off: #4a4a4a; --sel: #ffffff;
}

/* ---------------------------------------------------------------- base */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); text-shadow: var(--glow);
       -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; text-shadow: inherit; }
a { color: var(--accent); }
::selection { background: var(--accent); color: var(--accent-ink); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border: 3px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }
:focus-visible { outline: 1px dashed var(--accent); outline-offset: 2px; }

/* A box: a border with its title cut into the top edge. */
.box { position: relative; border: 1px solid var(--line); border-radius: var(--radius);
       padding: 16px 14px 12px; margin: 9px 0 0; min-width: 0; }
.box > .lg { position: absolute; top: -.78em; left: 9px; padding: 0 5px; background: var(--bg);
             color: var(--legend); line-height: 1.4; white-space: nowrap; }
.box > .lg-r { left: auto; right: 9px; }
.box.tight { padding: 12px 10px 10px; }

/* ---------------------------------------------------------------- layout */
#shell { display: grid; height: 100vh; padding: 6px 10px 8px; gap: 0 10px;
         grid-template-columns: 92px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
         grid-template-areas: "top top" "nav main" "foot foot"; }
#top { grid-area: top; display: flex; align-items: center; gap: 12px; padding: 4px 2px 2px; min-width: 0; }
#top .brand { color: var(--text); font-weight: 700; letter-spacing: .5px; }
#top .brand b { color: var(--accent); }
#top .sum { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#top .sp { flex: 1; }
.tag { border: 1px solid var(--warn); color: var(--warn); padding: 0 6px; font-size: 12px; white-space: nowrap; }
#nav { grid-area: nav; display: flex; flex-direction: column; min-height: 0; padding: 14px 0 8px; }
#nav .list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 0; }
#main { grid-area: main; overflow-y: auto; overflow-x: hidden; padding: .3em 4px 6px 2px; min-height: 0; }   /* room for the first boxes' titles */
#foot { grid-area: foot; }
#foot .box { display: flex; gap: 14px; align-items: center; padding: 8px 12px 6px; }
#msg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#msg.err { color: var(--down); } #msg.ok { color: var(--ok); }
#keys { color: var(--muted); white-space: nowrap; }
#keys kbd { color: var(--text); font: inherit; }
#keys button { background: none; border: 0; padding: 1px 3px; margin: 0 -3px; font: inherit; color: inherit; cursor: pointer;
               border-radius: var(--radius); transition: background .15s, color .15s; }
#keys button:hover, #keys button:focus-visible { background: var(--raise); color: var(--text); outline: none; }
#keys button:hover kbd { color: var(--accent); }
#keys button:active { transform: translateY(1px); }

/* nav tiles, like a server rail: a square tile, a status square, a selection bar */
.tile { position: relative; display: flex; justify-content: center; padding: 5px 0 5px; cursor: pointer;
        background: none; border: 0; width: 100%; }
.tile .sq { width: 54px; height: 54px; display: grid; place-items: center; font-weight: 700; font-size: 17px;
            letter-spacing: 1px; color: var(--bg); background: var(--c, var(--muted)); border-radius: var(--radius);
            text-shadow: none; transition: filter .15s; }
.tile.dim .sq { filter: grayscale(.85) brightness(.6); }
.tile:hover .sq { filter: brightness(1.12); }
.tile .bar { position: absolute; left: 0; top: 50%; width: 4px; height: 8px; margin-top: -4px; background: var(--sel);
             transition: height .15s, margin .15s; opacity: 0; }
.tile:hover .bar { opacity: .6; height: 18px; margin-top: -9px; }
.tile.on .bar { opacity: 1; height: 40px; margin-top: -20px; }
.tile .st { position: absolute; right: calc(50% - 31px); bottom: 2px; width: 13px; height: 13px;
            border: 3px solid var(--bg); background: var(--off); }
.tile .badge { position: absolute; right: calc(50% - 32px); top: 1px; background: var(--accent); color: var(--accent-ink);
               font-size: 10.5px; font-weight: 700; padding: 0 4px; line-height: 15px; border: 2px solid var(--bg); text-shadow: none; }
.tile .sq.glyph { background: var(--raise); color: var(--text); border: 1px solid var(--line); font-size: 22px; font-weight: 400; }
.sep { height: 1px; background: var(--line); margin: 6px 22px; }

.dot { display: inline-block; width: 8px; height: 8px; background: var(--off); vertical-align: 1px; margin-right: 7px; flex: none; }
.s-ok { background: var(--ok) !important; } .s-warn { background: var(--warn) !important; }
.s-down { background: var(--down) !important; } .s-off, .s-unknown { background: var(--off) !important; }
.t-ok { color: var(--ok); } .t-warn { color: var(--warn); } .t-down { color: var(--down); } .t-muted, .t-off { color: var(--muted); }

/* ---------------------------------------------------------------- pages */
.grid { display: grid; gap: 4px 12px; }
.g2 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.cards { display: grid; gap: 4px 12px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.card { cursor: pointer; transition: border-color .15s; }
.card:hover { border-color: var(--line-hi); }
.card .h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.mini { width: 34px; height: 34px; display: grid; place-items: center; background: var(--c); color: var(--bg); font-weight: 700;
        font-size: 12.5px; flex: none; border-radius: var(--radius); text-shadow: none; }
.card .name { font-weight: 700; }
.card .ver { color: var(--muted); margin-left: auto; font-size: 12.5px; }
.card .hl { display: flex; align-items: baseline; }
.card .bl { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.upd { background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; padding: 0 5px; text-shadow: none; }

.hero { display: flex; gap: 14px; align-items: center; }
.hero .mini { width: 52px; height: 52px; font-size: 17px; }
.hero .name { font-size: 18px; font-weight: 700; }
.hero .sub { color: var(--muted); }
.headline { display: flex; align-items: baseline; margin: 12px 0 8px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 16px; }
.kv .k { color: var(--muted); }
.kv .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv .v.warn { color: var(--warn); } .kv .v.muted { color: var(--muted); }

.grp { margin-bottom: 9px; }
.grp .gt { color: var(--muted); font-size: 12.5px; margin-bottom: 4px; }
.btns { display: flex; flex-wrap: wrap; gap: 7px; }
.btns > .btn { max-width: 100%; white-space: normal; text-align: left; }   /* a long label wraps instead of running out of its box */
.btn { background: transparent; border: 1px solid var(--line-hi); padding: 4px 10px; cursor: pointer; border-radius: var(--radius);
       white-space: nowrap; }
.btn:hover { background: var(--raise); border-color: var(--text); }
.btn:active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); text-shadow: none; }
.btn.primary { border-color: var(--accent); color: var(--accent); }
.btn.primary:hover { background: var(--accent); color: var(--accent-ink); text-shadow: none; }
.btn.danger { border-color: var(--down); color: var(--down); }
.btn.danger:hover { background: var(--down); color: var(--bg); }
.btn.on::before { content: "[x] "; } .btn.off::before { content: "[ ] "; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 1px 7px; font-size: 12.5px; }

table.units { width: 100%; border-collapse: collapse; }
table.units th { text-align: left; color: var(--muted); font-weight: 400; padding: 0 10px 4px 0; border-bottom: 1px dashed var(--line); }
table.units td { padding: 4px 10px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
table.units td.m { color: var(--muted); }

/* settings: one row per field */
.fset .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; padding: 5px 0;
             border-bottom: 1px dashed var(--line); align-items: center; }
.fset .row:last-child { border-bottom: 0; }
.fset .row.full { grid-template-columns: minmax(0, 1fr); }
.fset .help { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; }
.fset .note { color: var(--muted); padding: 2px 0 4px; }
.fset .sec { color: var(--legend); margin: 10px 0 2px; }
.fset .sec:first-child { margin-top: 0; }
.chk { background: none; border: 0; cursor: pointer; padding: 0 2px; color: var(--muted); white-space: nowrap; }
.chk.on { color: var(--accent); }
.chk::before { content: "[ ] "; color: var(--muted); } .chk.on::before { content: "[x] "; color: var(--accent); }
.inp { background: var(--raise); border: 1px solid var(--line); padding: 3px 7px; min-width: 0; border-radius: var(--radius); }
.inp:focus { border-color: var(--accent); outline: none; }
.inp.num { width: 82px; text-align: right; }
.inp.wide { width: 100%; }
select.inp { padding: 3px 4px; }
.seg { display: flex; flex-wrap: wrap; gap: 0; }
.seg button { background: none; border: 1px solid var(--line); margin-left: -1px; padding: 2px 9px; cursor: pointer; color: var(--muted); }
.seg button.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); text-shadow: none; position: relative; }

code { font: inherit; color: var(--text); background: var(--raise); border: 1px solid var(--line); padding: 0 4px;
       border-radius: var(--radius); white-space: pre-wrap; }
.callout code, .req code, .result code { background: var(--bg); }
pre.log { margin: 0; max-height: 300px; overflow: auto; font: 12.5px/1.45 var(--font); color: var(--muted); white-space: pre-wrap;
          word-break: break-all; }
.lg .lnk { color: var(--muted); cursor: pointer; background: var(--bg); border: 0; padding: 0; }
.lg .lnk:hover { color: var(--accent); }

/* theme picker */
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.th { border: 1px solid var(--line); padding: 8px; cursor: pointer; background: none; text-align: left; }
.th.on { border-color: var(--accent); }
.th .pv { height: 58px; border: 1px solid; position: relative; margin-bottom: 6px; }
.th .pv i { position: absolute; display: block; }
.applist .row { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.applist .row:last-child { border-bottom: 0; }
.applist .row .mini { width: 26px; height: 26px; font-size: 10.5px; }
.applist .row .n { flex: 1; min-width: 0; }
.form2 { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 12px; align-items: center; }
.form2 label { color: var(--muted); }

/* dialog */
#dlg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; place-items: center; z-index: 9; padding: 16px; }
#dlg.open { display: grid; }
/* the contents scroll, not the box: a box that scrolls clips its title, which sits on the border */
#dlg .box { background: var(--bg); width: min(560px, 100%); max-height: 80vh; display: flex; flex-direction: column; }
#dlgb { overflow: auto; min-height: 0; padding: 4px; margin: -4px; }   /* room for the buttons' focus ring */
#dlg .body { margin: 2px 0 14px; white-space: pre-wrap; }
#dlg pre { margin: 0 0 12px; max-height: 50vh; overflow: auto; font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
.blink::after { content: "▌"; animation: bl 1s steps(1) infinite; color: var(--accent); }
@keyframes bl { 50% { opacity: 0; } }

/* ---------------------------------------------------------------- installer */
.plat { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
.plat > span { white-space: nowrap; }
.plat .here { color: var(--text); }
.plat .here::after { content: " ◂ this computer"; color: var(--accent); font-size: 11.5px; }
.ic { display: inline-block; width: 7px; height: 7px; margin-right: 6px; vertical-align: 1px; background: var(--off); }
.ic.full { background: var(--ok); } .ic.limited { background: var(--warn); }
.ic.none { background: transparent; box-shadow: inset 0 0 0 1px var(--off); }
.icard { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.icard .h { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.icard .name { font-weight: 700; }
.icard .ver { color: var(--muted); margin-left: auto; font-size: 12.5px; text-align: right; }
.icard .bl { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
.icard .stl { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .6ch; margin: 8px 0 2px; min-height: 1.45em; }
.icard .stl .dot { margin-right: 1px; }
.icard .nt { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.icard .acts { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.mbar { height: 3px; background: var(--line); margin-top: 8px; overflow: hidden; }
.mbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.hostline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.hostline .os { font-weight: 700; }
.spin { display: inline-block; width: 1ch; color: var(--accent); }

#wiz { position: fixed; inset: 0; z-index: 8; display: none; place-items: center; padding: 16px; }
#wiz.open { display: grid; }
#wiz .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.62); animation: fadeIn .25s ease both; }
#wiz .wpanel { position: relative; width: min(780px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column;
               background: var(--bg); border-color: var(--line-hi); margin: 0; padding: 20px 18px 12px;
               animation: popIn .38s cubic-bezier(.2,.9,.25,1.08) both; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
#wiz.closing .scrim { animation: fadeOut .2s ease both; }
#wiz.closing .wpanel { animation: popOut .2s ease both; }
.wpanel > .lg-r .lnk { font: inherit; }
.whead { display: flex; gap: 14px; align-items: center; flex: none; }
.whead .mini { width: 46px; height: 46px; font-size: 15px; }
.whead .t { font-size: 17px; font-weight: 700; }
.whead .s { color: var(--muted); font-size: 12.5px; }
.whead .r { margin-left: auto; text-align: right; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.stepper { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); margin: 18px 0 4px; flex: none; }
.stepper .track, .stepper .fill { position: absolute; left: 10%; top: 6px; height: 1px; }
.stepper .track { right: 10%; background: var(--line); }
.stepper .fill { width: 0; background: var(--accent); transition: width .55s cubic-bezier(.2,.8,.2,1); }
.stepper .s { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted);
              font-size: 12px; transition: color .3s, opacity .3s; }
.stepper .s i { width: 13px; height: 13px; background: var(--bg); border: 1px solid var(--line-hi);
                transition: background .3s, border-color .3s, transform .45s cubic-bezier(.2,.9,.3,1.4), box-shadow .3s; }
.stepper .s.done i { background: var(--accent); border-color: var(--accent); }
.stepper .s.cur { color: var(--text); }
.stepper .s.cur i { border-color: var(--accent); transform: rotate(45deg) scale(1.15);
                    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.stepper .s.skip { opacity: .4; }
.stepper .s.bad i { background: var(--down); border-color: var(--down); }
.wbanner { flex: none; margin-top: 8px; color: var(--warn); font-size: 12.5px; text-align: center; }
.stage-vp { position: relative; flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; margin: 6px -4px 0; padding: 0 4px; }
.stage { padding: 12px 0 6px; }
.stage .lead { margin: 0 0 10px; }
.stage h4 { margin: 14px 0 6px; font-weight: 400; color: var(--legend); font-size: 12.5px; }
.stage h4:first-child { margin-top: 0; }
.wfoot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 12px; margin-top: 8px;
         border-top: 1px dashed var(--line); flex: none; }
.wfoot .sp { flex: 1; }
.btn.big { padding: 6px 16px; }
.btn.primary.go { background: var(--accent); color: var(--accent-ink); text-shadow: none; }
.btn.primary.go:hover { filter: brightness(1.1); }
.btn.danger.go { background: var(--down); color: var(--bg); border-color: var(--down); text-shadow: none; }
.loading { color: var(--muted); padding: 26px 0; text-align: center; }

.req { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 0 6px; padding: 5px 0; border-bottom: 1px dashed var(--line);
       animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
.req:last-child { border-bottom: 0; }
.req .m { font-weight: 700; } .req .m.ok { color: var(--ok); } .req .m.bad { color: var(--down); } .req .m.soft { color: var(--warn); }
.req .hint, .req .dt { grid-column: 2; color: var(--muted); font-size: 12.5px; }
.callout { border-left: 2px solid var(--accent); padding: 7px 11px; background: var(--raise); margin: 10px 0 4px;
           animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
.callout.warn { border-color: var(--warn); } .callout.bad { border-color: var(--down); }
.callout .hint { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 16px; }
.facts .k { color: var(--muted); } .facts .v { overflow: hidden; text-overflow: ellipsis; }
.will > div { position: relative; padding: 4px 0 4px 20px; animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
.will > div::before { content: "›"; position: absolute; left: 4px; color: var(--accent); font-weight: 700; }
.iopt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 9px 8px; cursor: pointer; border: 1px solid transparent;
       margin: 0 -8px; animation: rise .4s cubic-bezier(.2,.8,.2,1) both; background: none; text-align: left; width: calc(100% + 16px); }
.iopt:hover { border-color: var(--line); background: var(--raise); }
.iopt .box2 { color: var(--muted); transition: color .2s; }
.iopt.on .box2 { color: var(--accent); }
.iopt .box2 b { display: inline-block; width: 1ch; transition: transform .25s cubic-bezier(.2,.9,.3,1.6); }

.iopt .lab { font-weight: 700; }
.iopt .help { grid-column: 2; color: var(--muted); font-size: 12.5px; }

.pbar { position: relative; height: 18px; border: 1px solid var(--line-hi); padding: 2px; }
.pbar i { position: relative; display: block; height: 100%; width: 0; background: var(--accent); overflow: hidden;
          transition: width .6s cubic-bezier(.2,.8,.2,1), background .4s; }
.pbar i::after { content: ""; position: absolute; top: 0; bottom: 0; left: -46px; right: 0;
                 background: repeating-linear-gradient(-45deg, transparent 0 8px, rgba(255,255,255,.2) 8px 16px);
                 animation: stripes .8s linear infinite; }
.pbar.still i::after { display: none; }
.pbar.ok i { background: var(--ok); } .pbar.bad i { background: var(--down); }
.pinfo { display: flex; justify-content: space-between; gap: 10px; margin: 6px 0 12px; color: var(--muted); font-size: 12.5px; }
.pinfo b { color: var(--text); }
.steps { border: 1px solid var(--line); }
.steps .row { position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 0 8px; padding: 6px 10px;
              align-items: baseline; overflow: hidden; color: var(--muted); border-bottom: 1px dashed var(--line);
              transition: background .3s, color .3s; animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
.steps .row:last-child { border-bottom: 0; }
.steps .row.active { color: var(--text); background: var(--raise); }
.steps .row.active::before { content: ""; position: absolute; inset: 0; pointer-events: none;

     animation: sweep 1.8s ease-in-out infinite; }
.steps .row.done, .steps .row.failed { color: var(--text); }
.steps .ico { text-align: center; font-weight: 700; }
.steps .done .ico { color: var(--ok); animation: pop .4s cubic-bezier(.2,.9,.3,1.6) both; }

.steps .failed .ico { color: var(--down); animation: shake .4s both; }
.steps .active .ico { color: var(--accent); }
.steps .det { grid-column: 2 / -1; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 0; }
.steps .det:empty { display: none; }
.steps .tm { font-size: 12px; color: var(--muted); }
.steps .sbar { grid-column: 2 / -1; height: 2px; background: var(--line); margin-top: 5px; overflow: hidden; }
.steps .sbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s linear; }
.logwrap { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .35s cubic-bezier(.2,.8,.2,1), opacity .3s; }
.logwrap.open { grid-template-rows: 1fr; opacity: 1; }
.logwrap > div { overflow: hidden; }
.logwrap pre { margin: 10px 0 0; height: 200px; overflow: auto; border: 1px solid var(--line); padding: 6px 8px; font-size: 12px;
               color: var(--muted); white-space: pre-wrap; word-break: break-all; background: var(--raise); }

.result { text-align: center; padding: 6px 0 2px; }
.result .art { position: relative; width: 96px; height: 96px; margin: 4px auto 0; }
.result svg { width: 96px; height: 96px; overflow: visible; }
.result .ring { fill: none; stroke: var(--ok); stroke-width: 3; stroke-dasharray: 265; stroke-dashoffset: 265;
                transform: rotate(-90deg); transform-origin: 48px 48px; animation: draw .75s cubic-bezier(.6,0,.2,1) .05s forwards; }
.result .mark { fill: none; stroke: var(--ok); stroke-width: 5; stroke-linecap: square; stroke-linejoin: miter;
                stroke-dasharray: 70; stroke-dashoffset: 70; animation: draw .35s ease-out .7s forwards; }
.result.bad .ring, .result.bad .mark { stroke: var(--down); }
.result.warn .ring, .result.warn .mark { stroke: var(--warn); }
.result .burst i { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; background: var(--c, var(--accent));
                   opacity: 0; animation: burst .9s cubic-bezier(.15,.7,.3,1) .78s both; }
.result h3 { margin: 12px 0 4px; font-size: 17px; animation: rise .45s cubic-bezier(.2,.8,.2,1) .45s both; }
.result p { color: var(--muted); margin: 0 auto 6px; max-width: 540px; animation: rise .45s cubic-bezier(.2,.8,.2,1) .55s both; }
.result .callout { text-align: left; }

.icard.still { animation: none; }
#top .logo { display: block; flex: none; margin-right: -4px; }
.upd-tag { border-color: var(--accent); color: var(--accent); background: none; cursor: pointer; font: inherit; font-size: 12px; }
.upd-tag:hover { background: var(--accent); color: var(--accent-ink); }
.ghcode { border: 1px dashed var(--accent); padding: 10px 12px; margin: 6px 0 4px; animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
.ghcode .code { font-size: 26px; font-weight: 700; letter-spacing: 6px; color: var(--accent); margin: 4px 0 10px; }

/* app icons (falls back to the coloured glyph square) */
.mini.img, .tile .sq.img { background: none; padding: 0; overflow: hidden; }
.mini.img img, .tile .sq.img img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.tile.dim .sq.img { filter: grayscale(.9) brightness(.55); }

/* dragging tiles in the nav */
.tile[data-app] { touch-action: none; }
#navlist.dragging .tile { transition: transform .22s cubic-bezier(.2,.8,.2,1); }
#navlist.dragging .tile.lift { transition: none; z-index: 2; cursor: grabbing; }
.tile.lift .sq { box-shadow: 0 10px 24px rgba(0,0,0,.45), 0 0 0 2px var(--accent); transform: scale(1.08); transition: transform .15s; }
.tile.drop .sq { animation: pop .35s cubic-bezier(.2,.9,.3,1.6); }

/* terminal drawer */
body.has-term #main { padding-bottom: min(58vh, 540px); }
#term { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: none; padding: 0 10px 8px; pointer-events: none; }
#term.open { display: block; }
#term .tbox { pointer-events: auto; background: var(--bg); margin: 0; padding: 14px 10px 8px; height: min(56vh, 520px); display: flex;
              flex-direction: column; border-color: var(--line-hi); box-shadow: 0 -18px 40px rgba(0,0,0,.4);
              animation: slideUp .3s cubic-bezier(.2,.8,.2,1) both; }
#term.min .tbox { height: auto; }
#term.min .tscreen, #term.min .tkeys { display: none; }
#term.closing .tbox { animation: slideDown .2s ease both; }
.ttabs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.ttab { background: none; border: 1px solid var(--line); color: var(--muted); padding: 1px 8px; cursor: pointer; white-space: nowrap;
        max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.ttab.on { color: var(--text); border-color: var(--accent); }
.ttab .x { margin-left: 8px; color: var(--muted); }
.ttab .x:hover { color: var(--down); }
.ttab .run { display: inline-block; width: 6px; height: 6px; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.ttab .run.done { background: var(--off); }
.tscreen { position: relative; flex: 1; min-height: 0; overflow: auto; background: var(--raise); border: 1px solid var(--line);
           padding: 6px 8px; cursor: text; }
.tscreen:focus-within { border-color: var(--accent); }
.tscreen pre { margin: 0; font: 13px/1.3 var(--font); white-space: pre; color: var(--text); text-shadow: none; }
.tscreen pre a { color: var(--accent); }
.tscreen .cur { background: var(--accent); color: var(--accent-ink); }
.tscreen:not(:focus-within) .cur { background: none; outline: 1px solid var(--accent); color: inherit; }
.tscreen textarea { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; resize: none; border: 0; padding: 0; }
.tkeys { display: flex; gap: 6px; align-items: center; margin-top: 7px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.tkeys .sp { flex: 1; }
.tprompt { color: var(--warn); }
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } }
@keyframes slideDown { to { transform: translateY(30px); opacity: 0; } }

/* theme editor */
.ted { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; margin: 10px 0; }
.ted label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
input[type=range] { accent-color: var(--accent); }
.ted input[type=color] { width: 34px; height: 24px; padding: 0; border: 1px solid var(--line-hi); background: none; cursor: pointer; flex: none; }
.ted .hex { width: 84px; }
.th .acts { display: flex; gap: 6px; margin-top: 6px; }
.th .tag2 { color: var(--accent); font-size: 11.5px; }

@keyframes fadeIn { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: translateY(16px) scale(.97); } }
@keyframes popOut { to { opacity: 0; transform: translateY(10px) scale(.98); } }
@keyframes rise { from { opacity: 0; transform: translateY(7px); } }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 65% { transform: scale(1.4); opacity: 1; } 100% { transform: scale(1); } }
@keyframes shake { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@keyframes stripes { to { transform: translateX(22.63px); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes burst { 0% { opacity: 1; transform: rotate(var(--a)) translateX(30px) scale(1); }
                   100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--d, 70px)) scale(.2); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important;
                           transition-duration: .01ms !important; }
}

/* phones and narrow windows: the rail becomes a strip along the top */
/* phones and narrow browser windows (Orbit's own window is never narrower than 720 px, so it keeps the side bar) */
@media (max-width: 700px) {
  #wiz { padding: 12px 0 0; }
  #wiz .wpanel { width: 100%; height: 100%; max-height: none; border-width: 1px 0 0; padding: 18px 16px 12px; }
  .whead .r { display: none; }
  .stepper .s { font-size: 11px; }
  body { overflow: auto; }
  #shell { height: auto; min-height: 100vh; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto;
           grid-template-areas: "top" "nav" "main" "foot"; padding: 6px 16px 10px; }
  #nav { padding: 14px 0 4px; }
  #nav.box { padding-top: 12px; }
  #nav .list { display: flex; overflow-x: auto; overflow-y: hidden; }
  .tile { width: 62px; flex: none; }
  .tile .sq { width: 48px; height: 48px; font-size: 15px; }
  .tile .st { right: calc(50% - 28px); } .tile .badge { right: calc(50% - 29px); }
  table.units .opt { display: none; }
  .tile .bar { left: 50%; top: auto; bottom: -4px; width: 8px; height: 3px; margin: 0 0 0 -4px; }
  .tile.on .bar { width: 36px; height: 3px; margin: 0 0 0 -18px; }
  .tile:hover .bar { width: 18px; height: 3px; margin: 0 0 0 -9px; }
  .sep { display: none; }
  .g2 { grid-template-columns: minmax(0, 1fr); }
  #main { overflow: visible; }
  #keys { display: none; }
  table.units td { max-width: 140px; }
}
</style>

<body>
<div id="shell">
  <div id="top">
    <img class="logo" src="/icon.svg" alt="" width="22" height="22"><span class="brand">[<b>orbit</b>]</span>
    <span class="sum" id="sum">connecting…</span>
    <span class="sp"></span>
    <button class="tag upd-tag" id="orbitinst" hidden>install orbit</button>
    <button class="tag upd-tag" id="orbitupd" hidden title="A newer Orbit is out: open its download page"></button>
    <span class="tag" id="dry" hidden title="Orbit was started with --dry-run: nothing is changed">dry run</span>
  </div>
  <nav id="nav" class="box"><span class="lg">nav</span><div class="list" id="navlist"></div></nav>
  <main id="main"></main>
  <div id="foot"><div class="box tight"><span class="lg">status</span>
    <span id="msg">ready</span>
    <span id="keys"><button data-key="j" title="next (j or ↓)"><kbd>j</kbd></button>/<button data-key="k" title="previous (k or ↑)"><kbd>k</kbd></button> move ·
      <button data-key="r"><kbd>r</kbd> refresh</button> · <button data-key="t"><kbd>t</kbd> theme</button> ·
      <button data-key="i"><kbd>i</kbd> install</button> · <button data-key=","><kbd>,</kbd> settings</button> ·
      <button data-key="?"><kbd>?</kbd> help</button></span>
  </div></div>
</div>
<div id="wiz"><div class="scrim"></div></div>
<div id="term"></div>
<div id="dlg" role="dialog" aria-modal="true"><div class="box"><span class="lg" id="dlgt">confirm</span><div id="dlgb"></div></div></div>

<script>
"use strict";
// ------------------------------------------------------------------ tiny helpers
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
const box = (legend, ...kids) => h("section", { class: "box" }, h("span", { class: "lg" }, legend), ...kids);
// An app's own icon, or its coloured glyph square when it has none.
function mark(a, cls = "mini") {
  return a.icon ? h("span", { class: cls + " img" }, h("img", { src: a.icon, alt: "", draggable: "false" }))
                : h("span", { class: cls, style: `--c:${a.color}` }, a.glyph);
}
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((data && data.error) || r.statusText);
  return data;
}
function say(text, kind) {
  const m = $("#msg");
  m.textContent = "> " + text;
  m.className = kind || "";
  clearTimeout(say.t);
  if (kind !== "err") say.t = setTimeout(() => { m.textContent = "> ready"; m.className = ""; }, 6000);
}
// Versions as people write them: "0.1.0a15" (Python), "0.9.13~alpha" (Debian) and "v0.1.4" all read the same way.
function pv(v) {
  v = String(v || "").trim().replace(/^v(?=\d)/i, "").replace(/~/g, "-");
  return v.replace(/^(\d+(?:\.\d+)*)(a|b|rc)(\d+)$/, (_, n, k, d) => `${n}-${{ a: "alpha", b: "beta", rc: "rc" }[k]}.${d}`);
}
// Text with `commands` in it: the commands are shown as code.
function rt(text) {
  return String(text == null ? "" : text).split("`").map((part, i) => i % 2 ? h("code", {}, part) : part);
}
const STATE_WORD = { ok: "ok", warn: "attention", down: "down", off: "off", unknown: "unknown" };
const store = {
  get(k, d) { try { const v = localStorage.getItem("orbit." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("orbit." + k, JSON.stringify(v)); } catch {} },
};

// ------------------------------------------------------------------ state
const S = { hub: null, apps: [], view: store.get("view", "overview"), detail: null, timer: null, editing: false, navIdx: 0 };

function setTheme(id) {
  document.documentElement.dataset.theme = id;
  store.set("theme", id);
}
// paint the last theme at once (custom ones too); the server's copy wins after load
document.head.append(h("style", { id: "ctheme" }, store.get("ctheme", "")));
setTheme(store.get("theme", "tui"));

// ------------------------------------------------------------------ nav
function navItems() {
  return [{ id: "overview", glyph: "◎", name: "overview" }, ...S.apps.filter(a => a.enabled),
          { id: "install", glyph: "+", name: "install apps" }, { id: "hub", glyph: "⚙", name: "orbit settings" }];
}
function renderNav() {
  // Tiles are built once per set of apps and then only updated, so a click never lands on a tile
  // that a refresh just replaced.
  const list = $("#navlist");
  const items = navItems();
  const sig = items.map(x => x.id + ":" + (x.glyph || "") + ":" + (x.color || "") + ":" + (x.icon || "")).join("|");
  if (list.dataset.sig !== sig) {
    list.replaceChildren();
    items.forEach((it, i) => {
      if (it.id === "install" || i === 1) list.append(h("div", { class: "sep" }));
      const isApp = !!it.color;
      list.append(h("button", { class: "tile", "data-id": it.id, "data-app": isApp ? "1" : null, "aria-label": it.name,
          onclick: () => { if (!S.dragged) go(it.id); } },
        h("span", { class: "bar" }),
        isApp ? mark(it, "sq") : h("span", { class: "sq glyph" }, it.glyph),
        isApp ? h("span", { class: "st" }) : null,
        isApp || it.id === "install" ? h("span", { class: "badge", hidden: true }, "UPD") : null));
    });
    list.dataset.sig = sig;
  }
  for (const it of items) {
    const t = list.querySelector(`.tile[data-id="${CSS.escape(it.id)}"]`);
    const isApp = !!it.color;
    t.classList.toggle("on", S.view === it.id);
    t.classList.toggle("dim", isApp && (it.state === "off" || it.state === "down"));
    t.title = isApp ? `${it.name} — ${it.headline || ""}` : it.name;
    if (isApp) {
      t.querySelector(".st").className = "st s-" + (it.state || "unknown");
      t.querySelector(".badge").hidden = !it.update;
    }
    if (it.id === "install") {
      const n = S.apps.filter(a => a.install && a.install.update).length;
      const b = t.querySelector(".badge");
      b.hidden = !n; b.textContent = n > 1 ? n + " UPD" : "UPD";
      t.title = n ? `install apps — ${n} update${n > 1 ? "s" : ""} ready` : "install apps";
    }
  }
  S.navIdx = Math.max(0, items.findIndex(x => x.id === S.view));
}
// Drag an app's tile up or down the side bar (left or right on a phone) to reorder; the order is saved.
function enableNavDrag() {
  const list = $("#navlist");
  let d = null;
  list.addEventListener("pointerdown", e => {
    const t = e.target.closest(".tile[data-app]");
    if (t && e.button === 0) d = { t, x: e.clientX, y: e.clientY, id: e.pointerId, on: false };
  });
  list.addEventListener("pointermove", e => {
    if (!d || e.pointerId !== d.id) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!d.on) {
      if (Math.hypot(dx, dy) < 7) return;
      d.on = true;
      d.horiz = getComputedStyle(list).display === "flex";
      d.tiles = [...list.querySelectorAll(".tile[data-app]")];
      d.from = d.to = d.tiles.indexOf(d.t);
      const r = d.tiles.map(x => x.getBoundingClientRect());
      d.size = r.length > 1 ? (d.horiz ? r[1].left - r[0].left : r[1].top - r[0].top) : 1;
      list.classList.add("dragging");
      d.t.classList.add("lift");
      try { d.t.setPointerCapture(e.pointerId); } catch {}
    }
    e.preventDefault();
    const off = Math.max(-d.from * d.size, Math.min((d.tiles.length - 1 - d.from) * d.size, d.horiz ? dx : dy));
    const tr = v => v ? (d.horiz ? `translateX(${v}px)` : `translateY(${v}px)`) : "";
    d.t.style.transform = tr(off);
    d.to = Math.max(0, Math.min(d.tiles.length - 1, d.from + Math.round(off / d.size)));
    d.tiles.forEach((x, i) => {
      if (x === d.t) return;
      const shift = d.from < d.to && i > d.from && i <= d.to ? -d.size : d.from > d.to && i >= d.to && i < d.from ? d.size : 0;
      x.style.transform = tr(shift);
    });
  });
  const end = async e => {
    if (!d || e.pointerId !== d.id) return;
    const dd = d; d = null;
    if (!dd.on) return;
    S.dragged = true; setTimeout(() => { S.dragged = false; }, 60);
    list.classList.remove("dragging");
    dd.t.classList.remove("lift");
    dd.tiles.forEach(x => { x.style.transform = ""; });
    if (dd.to === dd.from || !S.hub) return;
    const vis = dd.tiles.map(x => x.dataset.id);
    const [moved] = vis.splice(dd.from, 1);
    vis.splice(dd.to, 0, moved);
    const shown = new Set(vis);
    let k = 0;

  try {
    const size = termSize();
    const r = await api(`/api/apps/${encodeURIComponent(d.id)}/action`, { action: a.id, args, cols: size.cols, rows: size.rows });
    if (r.term) { openTerm(r.term, r.title); return say(r.message, "ok"); }
    if (r.job) return followJob(r.job);
    say(r.message || "done", "ok");
    if (r.removed) { S.view = "overview"; await loadHub(); }
    setTimeout(poll, 400);

async function followJob(id) {
  for (;;) {
    let j;

    if (j.state === "running") { say(j.title + " … " + Math.round(Date.now() / 1000 - j.started) + " s"); await new Promise(r => setTimeout(r, 900)); continue; }
    say(j.title + (j.state === "done" ? ": done" : ": failed"), j.state === "done" ? "ok" : "err");
    showDlg(j.title + " · " + j.state, h("pre", {}, j.output || "(no output)"), [["close", true]]);

}

// Swap the stage content: the old one slides out, the new one in, and the panel eases to its new height.
function setStage(n, dir, node, buttons) {
  const { panel, vp, stepper, foot } = W.el;
  const h0 = panel.getBoundingClientRect().height;
  const old = vp.firstElementChild;
  if (n !== W.stage) {
    W.stage = n;
    const names = STAGES[W.op];
    stepper.querySelectorAll(".s").forEach((s, i) => {
      s.classList.toggle("done", i < n || (n === names.length - 1 && i === n && !W.failed));
      s.classList.toggle("cur", i === n && !(n === names.length - 1));
      s.classList.toggle("bad", i === n && !!W.failed);
      s.classList.toggle("skip", i === 1 && W.noOptions && n > 1);
    });
    stepper.querySelector(".fill").style.width = (n / (names.length - 1)) * 80 + "%";
  }
  foot.replaceChildren(...buttons);
  vp.replaceChildren(node);
  if (REDUCE || !old || old === node) return;
  const h1 = panel.getBoundingClientRect().height;
  if (Math.abs(h1 - h0) > 1) panel.animate([{ height: h0 + "px" }, { height: h1 + "px" }], { duration: 340, easing: EASE });
  node.animate([{ opacity: 0, transform: `translateX(${dir * 34}px)` }, { opacity: 1, transform: "none" }], { duration: 340, easing: EASE });

  vp.prepend(old);
  old.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: `translateX(${-dir * 34}px)` }], { duration: 260, easing: EASE })
    .onfinish = () => old.remove();
}

function paintJob() {
  const j = W.job;
  W.target = j.state === "done" ? 1 : j.progress;
  W.el.bar.querySelector("i").style.width = (W.target * 100).toFixed(2) + "%";
  W.el.bar.classList.toggle("still", j.state !== "running");

    [j.state === "done" ? "finished" : j.state === "cancelled" ? "stopped" : j.state === "failed" ? "stopped with a problem" : "starting…"]));

async function followJob2() {

    try { S.hub = Object.assign(S.hub, await api("/api/hub", patch)); say(msg, "ok"); }
    catch (e) { say(e.message, "err"); }
  };
  const pick = async t => { setTheme(t.id); hub.settings.theme = t.id; await setHub({ theme: t.id }, "theme · " + t.label); renderHub(); };
  const startEdit = t => {
    const base = t && t.custom ? t : null;
    S.themeEdit = { id: base ? base.id : "custom-" + Date.now().toString(36), label: base ? base.label : "my theme",
                    tokens: themeTokens(t ? t.id : hub.settings.theme) };
    renderHub();
    $("#main").scrollTop = 0;
  };
  const themes = h("div", { class: "themes" }, hub.themes.map(t => {
    const tk = themeTokens(t.id);
    return h("div", { class: "th" + (hub.settings.theme === t.id ? " on" : ""), role: "button", tabindex: 0,
        onclick: e => { if (!e.target.closest(".acts")) pick(t); }, onkeydown: e => { if (e.key === "Enter") pick(t); } },
      h("div", { class: "pv", style: `background:${tk.bg};border-color:${tk.line};border-radius:${tk.radius}px` },
        h("i", { style: `left:8px;top:10px;width:30px;height:30px;background:${tk.accent};border-radius:${tk.radius}px` }),
        h("i", { style: `left:31px;top:33px;width:9px;height:9px;background:${tk.ok};outline:2px solid ${tk.bg}` }),
        h("i", { style: `left:50px;top:12px;width:60%;height:5px;background:${tk.text};opacity:.85` }),
        h("i", { style: `left:50px;top:24px;width:40%;height:5px;background:${tk.line}` }),
        h("i", { style: `left:50px;top:36px;width:25%;height:5px;background:${tk.accent}` })),
      h("span", {}, (hub.settings.theme === t.id ? "(•) " : "( ) ") + t.label, t.custom ? h("span", { class: "tag2" }, "  custom") : null),
      h("div", { class: "acts" },
        h("button", { class: "btn small", onclick: () => startEdit(t) }, t.custom ? "edit" : "copy & edit"),
        t.custom ? h("button", { class: "btn small danger", onclick: async () => {
          if (!(await confirmDlg(`Delete the theme “${t.label}”?`, true))) return;
          const left = hub.themes.filter(x => x.custom && x.id !== t.id).map(({ id, label, tokens }) => ({ id, label, tokens }));
          try { S.hub = Object.assign(S.hub, await api("/api/hub", { themes: left })); applyCustomThemes(); setTheme(S.hub.settings.theme); say("theme deleted", "ok"); renderHub(); }
          catch (e) { say(e.message, "err"); } } }, "delete") : null));
  }));
  const themeBox = S.themeEdit
    ? box("theme editor · " + (hub.themes.some(t => t.id === S.themeEdit.id) ? "edit" : "new"), themeEditor(setHub))
    : box("theme", themes, h("div", { class: "btns", style: "margin-top:10px" },
        h("button", { class: "btn", onclick: () => startEdit(null) }, "+ new theme"),
        h("span", { class: "t-muted", style: "font-size:12.5px;align-self:center" }, "start from the current one and change any colour")));

  const general = h("div", { class: "fset" },
    h("div", { class: "row" }, h("span", {}, "Refresh every (seconds)"),
      (() => { const i = h("input", { class: "inp num", type: "number", min: 1, max: 60,
        onchange: e => setHub({ refreshSec: Math.round(+e.currentTarget.value) || 3 }, "refresh · " + e.currentTarget.value + " s") }); i.value = hub.settings.refreshSec; return i; })()),
    h("div", { class: "row" }, h("span", {}, "Check GitHub for new releases"),
      (() => { const c = h("button", { class: "chk" + (hub.settings.checkUpdates ? " on" : ""), onclick: async () => {
        const v = !hub.settings.checkUpdates; await setHub({ checkUpdates: v }, "release checks · " + (v ? "on" : "off")); renderHub(); } },
        hub.settings.checkUpdates ? "on" : "off"); return c; })(),
      h("div", { class: "help" }, "At most every 12 hours, one request per app to api.github.com. Nothing else leaves this computer.")),
    h("div", { class: "row" }, h("span", {}, "Update Orbit by itself"),
      (() => { const c = h("button", { class: "chk" + (hub.settings.autoUpdate !== false ? " on" : ""), role: "switch",
        "aria-checked": String(hub.settings.autoUpdate !== false), onclick: async () => {
        const v = hub.settings.autoUpdate === false; await setHub({ autoUpdate: v }, "update by itself · " + (v ? "on" : "off")); renderHub(); } },
        hub.settings.autoUpdate !== false ? "on" : "off"); return c; })(),
      h("div", { class: "help" }, "When Orbit starts and a newer version is out, it downloads it, checks it and keeps it ready; it takes " +
        "Orbit's place the next time you open Orbit (or now, with “restart for orbit …” at the top). Needs release checks on.")),
    hub.settings.notifyApprovals !== undefined && (hub.system || "linux") === "linux" ? h("div", { class: "row" }, h("span", {}, "Tell me when Nova waits for an approval"),
      (() => { const c = h("button", { class: "chk" + (hub.settings.notifyApprovals !== false ? " on" : ""), role: "switch",
        "aria-checked": String(hub.settings.notifyApprovals !== false), onclick: async () => {
        const v = hub.settings.notifyApprovals === false; await setHub({ notifyApprovals: v }, "approval notifications · " + (v ? "on" : "off")); renderHub(); } },
        hub.settings.notifyApprovals !== false ? "on" : "off"); return c; })(),
      h("div", { class: "help" }, "While Orbit is open, a desktop notification when a browser asks Nova to be let in (or asks for something " +
        "that needs your OK). Approve it on Nova's card with the code the browser shows. Needs Nova 0.9.20 or newer.")) : null,
    h("div", { class: "row" }, h("span", {}, "Check for releases now"),
      h("button", { class: "btn small", onclick: async () => { try { say((await api("/api/hub/check-updates", {})).message); setTimeout(async () => { await loadHub(); poll(); }, 2500); } catch (e) { say(e.message, "err"); } } }, "check")),
    hub.menu && hub.menu.deb ? h("div", { class: "row" }, h("span", {}, "Installed with the Debian package"),
      h("div", { class: "help" }, "apt keeps Orbit up to date (it asks for your password). Remove it with your software installer, or sudo apt remove orbit.")) :
    hub.menu && hub.menu.install ? h("div", { class: "row" }, h("span", {}, hub.menu.installed ? "Installed for you" : "Install Orbit for you"),
      hub.menu.installed ? h("span", { class: "btns" }, h("button", { class: "btn small", onclick: installOrbit }, "refresh"),
                                                        h("button", { class: "btn small danger", onclick: removeOrbit }, "remove"))
                         : h("button", { class: "btn small", onclick: installOrbit }, "install"),
      h("div", { class: "help" }, hub.menu.installed
        ? `Installed in ${hub.menu.home}, with ${installWords(hub.menu).has}. Remove takes them away again; your settings stay.`
        : `Moves this program to ${hub.menu.home} and puts Orbit in ${installWords(hub.menu).goes}. ${installWords(hub.menu).no}, and it keeps updating itself there.`)) :
    hub.menu && hub.menu.supported ? h("div", { class: "row" }, h("span", {}, `Orbit in ${hub.menu.where}`),
      h("button", { class: "btn small", onclick: async () => {
        try { const r = await api("/api/hub/menu", {}); say(r.message, r.ok ? "ok" : "err"); await loadHub(); renderHub(); } catch (e) { say(e.message, "err"); } } },
        hub.menu.added ? "refresh" : "add"),
      h("div", { class: "help" }, hub.menu.added ? "Already there. Refresh it if you moved Orbit." : "Adds a launcher for this copy of Orbit.")) : null);

  const order = hub.apps.map(a => a.id);
  const move = async (i, dir) => {
    const o = order.slice(); const j = i + dir; if (j < 0 || j >= o.length) return;
    [o[i], o[j]] = [o[j], o[i]];
    await setHub({ order: o }, "order saved"); await loadHub(); await poll(); renderHub();
  };
  const appsList = h("div", { class: "applist" }, h("div", { class: "t-muted", style: "font-size:12.5px;padding-bottom:4px" }, "Tip: drag an app's tile in the side bar to move it."),
    hub.apps.map((a, i) => h("div", { class: "row" },
    mark(a),
    h("span", { class: "n" }, a.name, a.custom ? h("span", { class: "t-muted" }, "  · added here") : null),
    h("button", { class: "btn small", disabled: i === 0, onclick: () => move(i, -1), "aria-label": "move up" }, "↑"),
    h("button", { class: "btn small", disabled: i === hub.apps.length - 1, onclick: () => move(i, 1), "aria-label": "move down" }, "↓"),
    h("button", { class: "chk" + (a.enabled ? " on" : ""), onclick: async () => {
      await setHub({ enabled: { [a.id]: !a.enabled } }, a.name + (a.enabled ? " hidden" : " shown")); await loadHub(); await poll(); renderHub(); } },
      a.enabled ? "shown" : "hidden"))));

  const F = {};
  const inp = (k, ph) => (F[k] = h("input", { class: "inp wide", placeholder: ph || "", spellcheck: "false", autocomplete: "off" }));
  const linux = !hub.system || hub.system === "linux";
  if (linux) F.scope = h("select", { class: "inp" }, h("option", { value: "user" }, "user service"), h("option", { value: "system" }, "system service (read-only)"));
  const add = h("div", {},
    h("div", { class: "t-muted", style: "margin-bottom:10px" }, linux
      ? "Any app with a systemd service, a health address or a web page. Built-in support for more of your apps comes with Orbit updates."
      : "Any app with a health address (a page that answers while it runs) or a web page. Built-in support for more of your apps comes with Orbit updates."),
    h("div", { class: "form2" },
      h("label", {}, "name"), inp("name", "My app"),
      linux ? [h("label", {}, "service"), h("div", { style: "display:flex;gap:8px" }, inp("unit", "myapp.service"), F.scope)] : null,
      h("label", {}, "health"), inp("healthUrl", "http://127.0.0.1:8080/health"),
      h("label", {}, "web page"), inp("openUrl", "http://127.0.0.1:8080/")),
    h("div", { class: "btns", style: "margin-top:12px;justify-content:flex-end" },
      h("button", { class: "btn primary", onclick: async () => {
        const spec = Object.fromEntries(Object.entries(F).map(([k, el]) => [k, el.value.trim()]));
        try { const r = await api("/api/hub/custom", spec); say("added " + spec.name, "ok"); await loadHub(); await poll(); go(r.id); }
        catch (e) { say(e.message, "err"); } } }, "add app")));

  main.replaceChildren(
    themeBox,
    h("div", { class: "grid g2" }, box("general", general), box("apps", appsList)),
    githubBox(),
    box("add an app", add),
    box("about", h("div", { class: "t-muted" }, `Orbit ${hub.version} by NovaLabs · MIT license · local only (127.0.0.1)`),
      h("div", { class: "btns", style: "margin-top:8px" },
        h("button", { class: "btn small", onclick: () => openLink("project") }, "project page"),
        h("button", { class: "btn small", onclick: () => openLink("releases") }, "releases"),
        h("button", { class: "btn small", onclick: () => openLink("issues") }, "report a problem"),
        h("button", { class: "btn small", onclick: showHelp }, "keyboard keys"))));
}

function countdownRestart(note, job, left = 5) {
  if (!W.open || W.job !== job) return;              // closed: the top bar's "restart for orbit …" waits instead
  if (left <= 0) { closeWizard(); return restartOrbit(); }
  note.textContent = `restarting in ${left} s · close this to restart later`;
  setTimeout(() => countdownRestart(note, job, left - 1), 1000);
}

// After Orbit updated itself: a new Orbit starts, this one ends; the page follows it and reloads on the new version.
// "install orbit" in words for this system: Linux (apps menu, the orbit command) or Windows (Start menu, installed apps)
function installWords(m) {
  return m.command
    ? { goes: "your apps menu with its icon (and orbit starts it from a terminal)", no: "No password needed",
        has: "its apps-menu entry, its icon and the orbit command", then: "", gone: "This window keeps working until you close it." }
    : { goes: "the Start menu and Windows' list of installed apps", no: "No administrator needed",
        has: "its Start-menu shortcut and its entry in the installed apps", then: " Orbit then starts again from there.", gone: "Orbit closes." };
}
async function installOrbit() {
  const m = S.hub.menu || {}, w = installWords(m);
  if (!m.installed && !await confirmDlg(`Install Orbit for you? This program moves to ${m.home}, out of the folder you downloaded it to, ` +
      `and Orbit goes in ${w.goes}. ${w.no}; it keeps updating itself there.${w.then}` +
      (m.elsewhere ? " It replaces the Orbit already installed there." : ""))) return;
  try { const r = await api("/api/hub/menu", { install: true }); say(r.message, r.ok ? "ok" : "err"); } catch (e) { say(e.message, "err"); }
  await loadHub(); if (S.view === "hub") renderHub();
}
async function removeOrbit() {
  const m = S.hub.menu || {}, w = installWords(m);
  if (!await confirmDlg(`Remove Orbit from this computer? Its program in ${m.home} and ${w.has} go; its settings stay. ${w.gone}`, true)) return;
  try { const r = await api("/api/hub/menu", { remove: true }); say(r.message, r.ok ? "ok" : "err"); } catch (e) { say(e.message, "err"); }
  await loadHub(); if (S.view === "hub") renderHub();
}
async function restartOrbit() {
  const was = S.hub && S.hub.version;
  try { say((await api("/api/hub/restart", {})).message); } catch (e) { return say(e.message, "err"); }
  if (S.hub && S.hub.dryRun) return;            // nothing restarts in a dry run
  clearTimeout(S.timer);
  for (let i = 0; i < 60; i++) {
    await new Promise(r => setTimeout(r, 1000));
    try { const hub = await api("/api/hub"); if (hub.version !== was) return location.reload(); } catch {}
  }
  say("Orbit didn't come back by itself: open it again", "err");
}
async function openLink(which) {
  try { say((await api("/api/hub/open-link", { which })).message, "ok"); } catch (e) { say(e.message, "err"); }
}

// ------------------------------------------------------------------ github sign-in
// GitHub's device flow: Orbit shows a code, you enter it on github.com, Orbit gets a read-only token.
const GH = { access: null, timer: null };
function githubBox() {
  const g = (S.hub && S.hub.github) || {};
  const b = box("github", h("div", { id: "ghbody" }));
  paintGithub(b.querySelector("#ghbody"), g);
  return b;
}
function paintGithub(el, g) {
  if (!el) return;
  const who = { orbit: `signed in as ${g.login ? "@" + g.login : "you"} (Orbit's own sign-in)`,
                gh: "using the GitHub command line's sign-in (gh)", env: "using the GITHUB_TOKEN set on this computer" }[g.source];
  const kids = [h("div", { class: "hl", style: "display:flex;align-items:baseline;margin-bottom:6px" },
    h("span", { class: "dot " + (g.signedIn ? "s-ok" : "s-off") }), h("span", {}, who || "not signed in"))];
  if (g.pending) {
    const code = g.pending.user_code;
    kids.push(h("div", { class: "ghcode" },
      h("div", { class: "t-muted", style: "font-size:12.5px" }, "On github.com/login/device, enter:"),
      h("div", { class: "code" }, code),
      h("div", { class: "btns" },
        h("button", { class: "btn primary", onclick: () => api("/api/github/open", {}).then(r => say(r.message, "ok")) }, "open github.com/login/device"),
        h("button", { class: "btn", onclick: e => { const t = e.currentTarget; navigator.clipboard.writeText(code).then(() => { t.textContent = "copied ✓"; }, () => say("copy it by hand: " + code)); } }, "copy code"),
        h("button", { class: "btn", onclick: async () => { S.hub.github = await api("/api/github/cancel", {}); paintGithub(el, S.hub.github); } }, "cancel")),
      h("div", { class: "t-muted", style: "margin-top:8px" }, spin(), " waiting for you to approve it on GitHub…")));
    clearTimeout(GH.timer);
    GH.timer = setTimeout(async () => {
      try { S.hub.github = await api("/api/github"); } catch { return; }
      if (!S.hub.github.pending) { say(S.hub.github.signedIn ? "signed in with GitHub" : (S.hub.github.error || "sign-in stopped"), S.hub.github.signedIn ? "ok" : "err"); GH.access = null; }
      if (S.view === "hub") paintGithub($("#ghbody"), S.hub.github);
    }, 2000);
  } else {
    if (g.error) kids.push(h("div", { class: "t-warn", style: "margin-bottom:6px" }, g.error));
    const btns = [];
    if (g.available && g.source !== "orbit") btns.push(h("button", { class: "btn primary", onclick: async () => {
      try { S.hub.github = await api("/api/github/login", {}); paintGithub(el, S.hub.github); if (S.hub.github.pending) api("/api/github/open", {}); }
      catch (e) { say(e.message, "err"); } } }, "sign in with GitHub"));
    if (g.source === "orbit") btns.push(h("button", { class: "btn danger", onclick: async () => {
      if (!(await confirmDlg("Sign out of GitHub in Orbit? Private repositories' releases won't be readable until you sign in again.", true))) return;
      S.hub.github = await api("/api/github/logout", {}); GH.access = null; paintGithub(el, S.hub.github); say("signed out", "ok"); } }, "sign out"));
    btns.push(h("button", { class: "btn", onclick: async e => {
      const t = e.currentTarget; t.disabled = true; t.replaceChildren(spin(), " checking");
      try { GH.access = (await api("/api/github/access")).access; } catch (err) { say(err.message, "err"); }
      paintGithub(el, S.hub.github); } }, "check access"));
    kids.push(h("div", { class: "btns" }, btns));
    if (!g.available && !g.signedIn) kids.push(h("div", { class: "t-muted", style: "font-size:12.5px;margin-top:6px" },
      "Every app Orbit installs is public, so this needs nothing from you. For an app from a private repository, Orbit can use the GitHub command line's sign-in (", h("code", {}, "gh auth login"), ") or a ", h("code", {}, "GITHUB_TOKEN"), " set on this computer."));
  }
  if (GH.access) kids.push(h("div", { class: "kv", style: "margin-top:10px" }, Object.entries(GH.access).flatMap(([repo, st]) => [
    h("span", { class: "k" }, repo), h("span", { class: "v " + (st === "no access" ? "warn" : "") },
      st === "no access" ? "✗ can't see it (private, and this sign-in has no access)" : st === "offline" ? "? couldn't reach GitHub" : `✓ ${st}`)])));
  if (g.available || g.signedIn) kids.push(h("div", { class: "help t-muted", style: "font-size:12.5px;margin-top:8px" },
    "Public repositories need no sign-in. Signing in lets Orbit read releases from private ones: the login can only read " +
    "repository contents, and the token stays on this computer (readable by you only), sent only to api.github.com."));
  el.replaceChildren(...kids);
}

// ------------------------------------------------------------------ keyboard
document.addEventListener("keydown", e => {
  if ($("#dlg").classList.contains("open")) return;
  if (W.open) {
    if (e.key === "Escape") { e.preventDefault(); closeWizard(); }
    else if (e.key === "Enter" && !/^(button|input|textarea)$/i.test(e.target.tagName || "")) {
      const go = W.el.foot.querySelector(".btn.go:not(:disabled)"); if (go) { e.preventDefault(); go.click(); }
    }
    return;
  }
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select" || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(j|k|ArrowDown|ArrowUp)$/.test(e.key)) e.preventDefault();
  doKey(e.key);
});
// the hints at the bottom do what their keys do
$("#keys").addEventListener("click", e => { const b = e.target.closest("[data-key]"); if (b) doKey(b.dataset.key); });
function doKey(k) {
  const items = navItems();
  if (k === "j" || k === "ArrowDown") go(items[Math.min(items.length - 1, S.navIdx + 1)].id);
  else if (k === "k" || k === "ArrowUp") go(items[Math.max(0, S.navIdx - 1)].id);
  else if (/^[1-9]$/.test(k)) { const a = S.apps.filter(x => x.enabled)[+k - 1]; if (a) go(a.id); }
  else if (k === "o") go("overview");
  else if (k === ",") go("hub");
  else if (k === "i") go("install");
  else if (k === "r") { poll(); if (S.view !== "overview" && S.view !== "hub") { loadDetail(true); } say("refreshed"); }
  else if (k === "t" && S.hub) {
    const ids = S.hub.themes.map(t => t.id), next = ids[(ids.indexOf(S.hub.settings.theme) + 1) % ids.length];
    S.hub.settings.theme = next; setTheme(next); api("/api/hub", { theme: next }).catch(() => {});
    say("theme · " + S.hub.themes.find(t => t.id === next).label); if (S.view === "hub") renderHub();
  }
  else if (k === "?") showHelp();
}
function showHelp() {
  showDlg("keys", h("div", { class: "kv" },
    ["j / ↓", "next", "k / ↑", "previous", "1–9", "jump to an app", "o", "overview", "i", "install apps", ",", "orbit settings",
     "r", "refresh", "t", "next theme", "?", "this list", "esc", "close a dialog or the installer"]
      .map((x, i) => h("span", { class: i % 2 ? "v" : "k" }, x))), [["close", true]]);
}

// ------------------------------------------------------------------ start
(async () => {
  enableNavDrag();
  try { await loadHub(); } catch (e) { say("can't reach Orbit's server: " + e.message, "err"); }
  await poll();
  render(true);
  restoreTerms();
})();
</script>
